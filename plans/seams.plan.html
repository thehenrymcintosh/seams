<!doctype html>

<title>seams, mapped with seams</title>
<style>
/* Colour carries two separate meanings and they never share a hue:
   - kind (what a thing is): endpoint cyan, contract indigo, event pink,
     type violet, data slate, storage teal-blue; shown as icon tint, labels
     and thin rules
   - cost of a change: breaking red, migration amber, additive green; shown
     as filled pills, bars and card borders
   Everything else stays neutral, so colour always means something. */
:root {
  --bg: #f5f5f2;
  --surface: #ffffff;
  --surface-2: #f0efea;
  --surface-3: #e7e5df;
  --text: #1b1b19;
  --muted: #64635e;
  --faint: #8f8d86;
  --border: #dddbd4;
  --accent: #2f5bd3;
  --accent-soft: rgba(47, 91, 211, 0.12);

  --k-endpoint: #0b7285;
  --k-contract: #3b5bdb;
  --k-event: #c2255c;
  --k-type: #7048c8;
  --k-data: #5c6b7a;
  --k-storage: #1c6e8c;
  --k-inside: #6b6a66;
  --k-run: #7c6f64;
  --type: var(--k-type);
  --type-soft: rgba(112, 72, 200, 0.12);

  --breaking: #c92a2a;
  --migration: #b35c00;
  --additive: #2b8a3e;
  --breaking-bg: #fde8e8;
  --migration-bg: #fff0db;
  --additive-bg: #e3f5e6;
  --ask: #6741d9;
  --ask-bg: #f0ebff;

  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.05);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312;
    --surface: #1c1c1a;
    --surface-2: #252523;
    --surface-3: #31312e;
    --text: #edece8;
    --muted: #a8a7a0;
    --faint: #7c7b75;
    --border: #383834;
    --accent: #8aa4ff;
    --accent-soft: rgba(138, 164, 255, 0.16);

    --k-endpoint: #3bc9db;
    --k-contract: #91a7ff;
    --k-event: #f783ac;
    --k-type: #b197fc;
    --k-data: #a5b4c3;
    --k-storage: #66b8d6;
    --k-inside: #a8a7a0;
    --k-run: #c4b8ad;
    --type-soft: rgba(177, 151, 252, 0.16);

    --breaking: #ff8787;
    --migration: #ffb454;
    --additive: #69db7c;
    --breaking-bg: #3d1d1d;
    --migration-bg: #3a2a12;
    --additive-bg: #18331f;
    --ask: #b197fc;
    --ask-bg: #2a2340;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12px; }
h1 { font-size: 21px; margin: 0; letter-spacing: -0.015em; }
h2 { font-size: 15px; margin: 28px 0 10px; }
h3 { font-size: 14px; margin: 0 0 4px; }
p { margin: 4px 0; }
kbd { font: 11px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--text); }
.muted { color: var(--muted); }
.noscript { padding: 16px; }
.badge { display: inline-block; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); font-size: 11px; color: var(--muted); }
.linklike { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* shell: main column + thin conversation sidebar */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 290px; min-height: 100vh; }
.main { min-width: 0; padding: 18px 22px 48px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .main { padding: 14px 16px 32px; }
}

header.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.heading { display: flex; gap: 10px; align-items: center; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 5px 13px; cursor: pointer; }
.tabs button + button { border-left: 1px solid var(--border); }
.tabs button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }

/* search */
.search { position: relative; }
.search input { width: 240px; max-width: 100%; font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hits { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; width: 380px; max-width: calc(100vw - 32px); list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.hits li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 0 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.hits li.on, .hits li:hover { background: var(--surface-2); }
.hit-label { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-hint { grid-column: 2; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind { grid-row: span 2; align-self: start; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding-top: 2px; }
.kind.k-endpoint { color: var(--k-endpoint); }
.kind.k-contract, .kind.k-operation { color: var(--k-contract); }
.kind.k-event { color: var(--k-event); }
.kind.k-type { color: var(--k-type); }
.kind.k-data { color: var(--k-data); }
.kind.k-storage { color: var(--k-storage); }
.kind.k-word { color: var(--ask); }

/* briefing: the page in ten seconds */
.briefing { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px 18px; align-items: start; margin-bottom: 12px; }
@media (max-width: 1100px) { .briefing { grid-template-columns: minmax(0, 1fr); } }
.eyebrow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.ask { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--text); border-radius: 10px; padding: 10px 14px; }
.ask p { font-size: 15px; line-height: 1.45; margin: 2px 0 0; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; min-width: 76px; padding: 6px 11px 7px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; text-align: left; transition: transform 0.1s, box-shadow 0.1s; }
.tile:not(:disabled):hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.tile:disabled { cursor: default; opacity: 0.5; }
.tile .n { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile.breaking .n { color: var(--breaking); }
.tile.migration .n { color: var(--migration); }
.tile.additive .n { color: var(--additive); }
.tile.asks .n { color: var(--ask); }
.tile.checks .n { color: var(--migration); }
.tile.breaking.active { background: var(--breaking-bg); border-color: var(--breaking); }
.tile.migration.active { background: var(--migration-bg); border-color: var(--migration); }
.tile.additive.active { background: var(--additive-bg); border-color: var(--additive); }
.tile.asks:not(:disabled) { background: var(--ask-bg); border-color: color-mix(in srgb, var(--ask) 40%, var(--border)); }
.stepper { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.stepper button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 12px 3px 4px; cursor: pointer; font-size: 13px; }
.stepper li:first-child button { padding-left: 12px; }
.stepper button[aria-pressed="true"] { border-color: var(--text); background: var(--text); color: var(--bg); }
.stepper li + li::before { content: "→"; color: var(--faint); margin-right: 6px; }
.stepper li:nth-child(2)::before { content: none; }
.stepper li { display: inline-flex; align-items: center; }
.step { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--text); font-size: 11.5px; font-weight: 700; flex: none; }
.stepper button[aria-pressed="true"] .step { background: var(--bg); color: var(--text); }
.words { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.words .eyebrow { margin-right: 4px; }
.word { border: 1px solid color-mix(in srgb, var(--ask) 35%, var(--border)); background: var(--surface); color: var(--text); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; cursor: pointer; text-decoration: none; }
.word:hover { background: var(--ask-bg); }

/* domain words in prose, and the one floating tip */
.term { text-decoration: underline dotted color-mix(in srgb, var(--ask) 70%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; }
.tip { position: fixed; z-index: 50; background: var(--text); color: var(--bg); font-size: 12.5px; line-height: 1.45; padding: 8px 10px; border-radius: 8px; box-shadow: var(--shadow); pointer-events: none; }
.tip b { color: inherit; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.filter-chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 1px 10px; font-size: 12px; cursor: pointer; }
.filter-chip.breaking { color: var(--breaking); border-color: var(--breaking); }
.filter-chip.migration { color: var(--migration); border-color: var(--migration); }
.filter-chip.additive { color: var(--additive); border-color: var(--additive); }

/* canvas: a pannable, zoomable graph */
.canvas-wrap { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.viewport { position: relative; height: 74vh; min-height: 480px; overflow: hidden; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 22px 22px; }
.viewport.dragging { cursor: grabbing; }
.viewport.dragging * { user-select: none; }
.layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.layer > .card { position: absolute; width: 320px; visibility: hidden; z-index: 1; cursor: default; }
.layer > .card.stub { width: 240px; }
.wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wires.under { z-index: 0; }
.wires.over { z-index: 2; }
.tools { position: absolute; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 3; }
.tool { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 12.5px; min-width: 28px; }
.tool:hover { border-color: var(--accent); color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); align-items: center; }
.legend .hint { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.legend .hint::before { display: none; }
.legend > span::before { content: ""; display: inline-block; width: 18px; height: 0; margin-right: 6px; vertical-align: 3px; border-top: 1.5px solid var(--muted); }
.legend .lg-event::before { border-top-style: dashed; }
.legend .lg-new::before { border-top-color: var(--additive); }
.legend .lg-type::before { border-top-color: var(--type); border-top-style: dotted; border-top-width: 2px; }
.legend .lg-route::before { border-top-color: var(--k-endpoint); border-top-width: 2px; }
.legend .lg-tag::before { width: 10px; height: 10px; border: 0; border-radius: 2px; vertical-align: -1px; }
.legend .lg-tag.breaking::before { background: var(--breaking); }
.legend .lg-tag.migration::before { background: var(--migration); }
.legend .lg-tag.additive::before { background: var(--additive); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); transition: opacity 0.15s; }
.card.stub { border-style: dashed; background: color-mix(in srgb, var(--surface) 55%, transparent); box-shadow: none; }
.card.selected, .card .selected { box-shadow: inset 0 0 0 2px var(--accent); }
.card.tag-breaking { border-color: var(--breaking); box-shadow: 0 0 0 1px var(--breaking), var(--shadow); }
.card.tag-migration { border-color: var(--migration); box-shadow: 0 0 0 1px var(--migration), var(--shadow); }
.card.tag-additive { border-color: var(--additive); box-shadow: 0 0 0 1px var(--additive), var(--shadow); }
.dim { opacity: 0.32; }
.unfocused { opacity: 0.22; }
.card-head { padding: 11px 13px 9px; cursor: grab; }
.title { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.purpose { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.facts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.fact { font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 4px; padding: 0 6px; }
.fact b { color: var(--text); }
.tally { display: inline-flex; gap: 3px; margin-left: auto; }
.title .tally + .x { margin-left: 4px; }
.dot { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; color: #fff; }
.dot.breaking { background: var(--breaking); }
.dot.migration { background: var(--migration); }
.dot.additive { background: var(--additive); }
@media (prefers-color-scheme: dark) { .dot { color: #141414; } }
.listens { display: flex; flex-wrap: wrap; gap: 3px 5px; align-items: baseline; font-size: 12px; margin-top: 4px; }
.listens-label { color: var(--muted); }
.ev { font-family: var(--mono); font-size: 11px; color: var(--k-event); background: color-mix(in srgb, var(--k-event) 10%, transparent); border-radius: 4px; padding: 0 5px; }
.linklike.quiet { color: var(--text); text-decoration-color: var(--border); font-weight: 600; }
.src { font-family: var(--mono); font-size: 11px; color: var(--faint); margin: 3px 0; }
.note { font-size: 12.5px; border-left: 2px solid var(--border); padding-left: 8px; color: var(--muted); margin: 5px 0; }
.note.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
details.src summary { cursor: pointer; list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.src summary::-webkit-details-marker { display: none; }

/* groups inside a card, coloured by kind */
.group { border-top: 1px solid var(--border); --k: var(--muted); }
.group.k-endpoints { --k: var(--k-endpoint); }
.group.k-contracts { --k: var(--k-contract); }
.group.k-data { --k: var(--k-data); }
.group.k-storage { --k: var(--k-storage); }
.group.k-inside { --k: var(--k-inside); }
.group.k-wiring, .group.k-signals, .group.k-tests { --k: var(--k-run); }
.kind.k-port, .kind.k-signal, .kind.k-test { color: var(--k-run); }
.run-chip.prose { font-family: var(--sans); text-align: left; }
.run-chip { font: 500 11px/1.5 var(--mono); color: var(--text); background: color-mix(in srgb, var(--k-run) 13%, transparent); border: 0; border-radius: 4px; padding: 0 5px; margin: 0 3px 2px 0; cursor: pointer; }
span.run-chip { cursor: default; }
.env { font: 700 9.5px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 4px; border-radius: 3px; margin-left: 3px; color: var(--k-run); border: 1px solid color-mix(in srgb, var(--k-run) 45%, transparent); }
.env.env-prod { color: var(--surface); background: var(--k-run); border-color: var(--k-run); }
.warn-pill { font: 700 9.5px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 4px; border-radius: 3px; color: var(--k-run); border: 1px dashed var(--k-run); margin-right: 2px; }
.adapters { display: grid; gap: 3px; margin: 6px 0; font-size: 12px; }
.adapters .env { margin: 0 4px 0 0; display: inline-block; min-width: 38px; text-align: center; }
.purpose-line { margin: 2px 0 6px; color: var(--muted); }
.sig-type { flex: none; font: 700 9.5px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 0; width: 44px; text-align: center; border-radius: 3px; color: var(--k-run); border: 1px solid color-mix(in srgb, var(--k-run) 45%, transparent); }
.sig-type.st-metric { color: var(--surface); background: var(--k-run); border-color: var(--k-run); }
.alert { display: inline-flex; color: var(--k-run); }
.alert .bell { stroke: currentColor; fill: none; }
.test-summary { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 2px 13px 6px; font-size: 11px; }
.lvl { font: 600 10px/1 var(--sans); padding: 3px 5px; border-radius: 3px; color: var(--k-run); background: color-mix(in srgb, var(--k-run) 13%, transparent); }
.lvl-e2e, .lvl-contract { background: transparent; border: 1px solid color-mix(in srgb, var(--k-run) 45%, transparent); }
.tstate { flex: none; width: 14px; text-align: center; font-size: 12px; color: var(--k-run); }
.tstate.planned { color: var(--faint); }
.test .row-name { white-space: normal; }
.untested { font-size: 11px; color: var(--faint); font-style: italic; }
.group-label { display: flex; align-items: center; gap: 6px; padding: 6px 13px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--k); }
.group-count { font-weight: 600; color: var(--faint); letter-spacing: 0; }
.group .icon { stroke: var(--k); }
.group > .row:first-of-type { border-top-color: transparent; }
.more { display: block; width: 100%; border: 0; border-top: 1px dashed var(--border); background: none; color: var(--k); font-size: 12px; padding: 5px 13px; text-align: left; cursor: pointer; }

.row { border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
.row-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 13px; background: none; border: 0; cursor: pointer; text-align: left; position: relative; min-height: 32px; }
.row-head:hover { background: var(--surface-2); }
.row-head[class*="mark-"]::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px; border-radius: 0 3px 3px 0; }
.row-head.mark-breaking::before { background: var(--breaking); }
.row-head.mark-migration::before { background: var(--migration); }
.row-head.mark-additive::before { background: var(--additive); }
.row-name { flex: 1; font-weight: 550; min-width: 0; }
.row-name.mono { font-weight: 500; }
.meta { font-size: 11.5px; color: var(--muted); }
.meta.sub-purpose { flex: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.root { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--k-data); margin-right: 5px; }
.chev { color: var(--faint); transition: transform 0.15s; }
.row-head[aria-expanded="true"] .chev, .agg-head[aria-expanded="true"] .chev, .store-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.icon { fill: none; stroke: var(--muted); stroke-width: 1.4; flex: none; }
.row-body { padding: 2px 13px 10px 13px; }
.row.open > .row-head { background: color-mix(in srgb, var(--k) 6%, transparent); }

/* endpoints */
.endpoint .row-head { gap: 7px; }
.verb { flex: none; font: 700 10px/1 var(--mono); letter-spacing: 0.02em; padding: 4px 5px; border-radius: 4px; min-width: 42px; text-align: center; color: #fff; background: var(--k-endpoint); }
.v-get { background: #1971c2; }
.v-post { background: #0b7285; }
.v-put, .v-patch { background: #5f3dc4; }
.v-delete { background: #a61e4d; }
.v-trpc, .v-grpc, .v-graphql, .v-queue, .v-cli { background: transparent; color: var(--k-endpoint); border: 1px solid var(--k-endpoint); }
@media (prefers-color-scheme: dark) {
  .v-get { background: #74c0fc; color: #10202e; }
  .v-post { background: #3bc9db; color: #0c2226; }
  .v-put, .v-patch { background: #b197fc; color: #1e1530; }
  .v-delete { background: #f783ac; color: #2f1220; }
  .v-trpc, .v-grpc, .v-graphql, .v-queue, .v-cli { background: transparent; color: var(--k-endpoint); }
}
.path { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: break-word; line-height: 1.35; }
.param { color: var(--k-endpoint); font-weight: 600; }
.aud { flex: none; display: inline-flex; align-items: center; color: var(--faint); }
.aud.a-public { color: var(--k-endpoint); }
.icon.lock { stroke: currentColor; }
.op-chip, .ep-chip { font-family: var(--mono); font-size: 11.5px; border-radius: 4px; padding: 0 5px; cursor: pointer; border: 1px solid transparent; }
.op-chip { color: var(--k-contract); background: color-mix(in srgb, var(--k-contract) 11%, transparent); }
.ep-chip { color: var(--k-endpoint); background: color-mix(in srgb, var(--k-endpoint) 11%, transparent); margin: 0 3px 2px 0; }
.op-chip:hover, .ep-chip:hover { border-color: currentColor; }
.callers { font-size: 11.5px; margin-top: 2px; }

/* contracts */
.member { padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }
.member:hover { background: var(--surface-2); }
.sig { font-family: var(--mono); font-size: 12px; line-height: 1.7; word-break: break-word; }
.mname { font-weight: 700; }
.arrow { color: var(--faint); }
.fname { color: var(--muted); }
.prim { color: var(--text); }
.mode { font-family: var(--sans); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; border-radius: 4px; padding: 0 4px; }
.mode.command { color: var(--k-contract); background: color-mix(in srgb, var(--k-contract) 12%, transparent); }
.mode.query { color: var(--k-contract); border: 1px solid color-mix(in srgb, var(--k-contract) 40%, transparent); }
.mode.event { color: var(--k-event); background: color-mix(in srgb, var(--k-event) 11%, transparent); }
.errs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.err { font-family: var(--mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.err::before { content: "! "; color: var(--faint); }

.chip { font-family: var(--mono); font-size: 12px; color: var(--type); background: var(--type-soft); border: 1px solid transparent; border-radius: 4px; padding: 0 4px; cursor: pointer; }
.chip:hover, .chip.hot-type { border-color: var(--type); }
.chip.linked { border-color: color-mix(in srgb, var(--type) 45%, transparent); }
.types { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.type-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
.typecard { border: 1px solid color-mix(in srgb, var(--type) 40%, var(--border)); border-left: 3px solid var(--type); border-radius: 6px; padding: 6px 8px; background: var(--surface); }
.typecard.hot-type, .row.hot-type { box-shadow: 0 0 0 2px var(--type-soft); }
.type-head { display: flex; justify-content: space-between; align-items: center; }
.type-name { background: none; border: 0; padding: 0; font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--type); cursor: pointer; }
.fields { font-family: var(--mono); font-size: 12px; line-height: 1.75; }
.key { font-family: var(--sans); font-size: 10px; font-weight: 700; color: var(--k-data); margin-left: 6px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
.values { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.value { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; }
.aux { font-size: 12px; color: var(--text); display: flex; flex-wrap: wrap; gap: 3px 5px; align-items: center; margin: 6px 0 2px; }
.aux-label { color: var(--muted); }
.has-facts { flex: none; font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.pill { font-size: 11px; background: var(--surface-2); border-radius: 999px; padding: 0 7px; }

/* aggregates: a consistency boundary around the tables it holds */
.aggregate { margin: 6px 10px 8px; border: 1.5px dashed color-mix(in srgb, var(--k-data) 55%, transparent); border-radius: 9px; overflow: hidden; }
.aggregate .row:first-of-type { border-top-color: transparent; }
.agg-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 10px; background: none; border: 0; cursor: pointer; text-align: left; font-size: 11px; color: var(--k-data); }
.agg-head:hover { background: var(--surface-2); }
.agg-label { flex: 1; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.invariants { margin: 2px 10px 8px; padding-left: 20px; font-size: 12px; }
.invariants li { margin: 3px 0; }
.invariants li::marker { color: var(--k-data); font-weight: 700; }
.aggregate > .changes { padding: 0 10px; }

/* storage */
.store { margin: 6px 10px 8px; border: 1px solid color-mix(in srgb, var(--k-storage) 35%, var(--border)); border-radius: 9px; overflow: hidden; }
.store-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; background: color-mix(in srgb, var(--k-storage) 6%, transparent); border: 0; cursor: pointer; text-align: left; }
.store-name { flex: 1; font-weight: 600; font-size: 13px; }
.engine { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; padding: 1px 6px; border-radius: 4px; color: #fff; background: var(--k-storage); }
.e-postgres { background: #336791; }
.e-dynamodb { background: #3b48cc; }
.e-mysql { background: #00758f; }
.e-redis { background: #a51d2d; }
.e-s3 { background: #3f8624; }
@media (prefers-color-scheme: dark) { .engine { filter: brightness(1.25); } }
.store .row { --k: var(--k-storage); }
.store > .note { margin: 6px 10px; }
.scan-count { flex: none; font-size: 10.5px; font-weight: 700; color: var(--migration); background: var(--migration-bg); border-radius: 4px; padding: 0 5px; }
.cols { border-collapse: collapse; width: 100%; margin: 4px 0 6px; }
.cols td { padding: 1px 8px 1px 0; vertical-align: baseline; }
.cols tr + tr td { border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
.ctype { color: var(--k-storage); }
.pk { font-family: var(--sans); font-size: 9.5px; font-weight: 700; color: var(--k-data); border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-right: 5px; }
.index { padding: 4px 0; border-top: 1px dashed var(--border); }
.idx-kind { font-family: var(--sans); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--k-storage); margin-right: 4px; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.serves { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.tick { color: var(--additive); font-weight: 700; margin-right: 4px; }
.scans { margin-top: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.store-link { border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--text); display: inline-flex; gap: 2px; align-items: center; }
.store-link:hover { text-decoration: underline; }

/* sub-modules: rows that open into a card nested inside the parent */
.nested { padding: 8px 10px 10px; border-top: 1px solid var(--border); background: var(--surface-2); }
.nested > .card { box-shadow: none; }
.title .x { margin-left: auto; }

.flash { animation: flash 0.9s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 2px var(--accent); } }

/* changes, shown on the node they affect */
.changes { list-style: none; padding: 0; margin: 6px 0 2px; font-size: 12px; }
.changes li { padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
.changes li.internal { color: var(--muted); }
.row > .changes, .store > .changes { padding: 0 13px 6px; margin-top: 0; }
.tag { flex: none; font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.tag.breaking { color: var(--breaking); background: var(--breaking-bg); }
.tag.migration { color: var(--migration); background: var(--migration-bg); }
.tag.additive { color: var(--additive); background: var(--additive-bg); }
.tag.internal { color: var(--muted); background: var(--surface-2); }

/* wires */
.wire { fill: none; stroke: var(--muted); stroke-width: 1.3; opacity: 0.75; }
.wire.event { stroke: var(--k-event); stroke-dasharray: 5 4; opacity: 0.6; }
.wire.type { stroke: var(--type); stroke-dasharray: 2 3; stroke-width: 1.4; opacity: 0.55; }
.wire.new { stroke: var(--additive); opacity: 1; stroke-width: 1.8; }
.wire.hot { stroke: var(--accent); stroke-width: 2.2; opacity: 1; }
.wire.event.hot { stroke: var(--k-event); }
.wire.route.hot { stroke: var(--k-endpoint); stroke-width: 2; }
.wire.type.hot { stroke: var(--type); stroke-dasharray: none; }
.wire.faded { opacity: 0.1; }
.ah { fill: var(--muted); }
.ah.hot { fill: var(--accent); }
.ah.route { fill: var(--k-endpoint); }

/* context below the canvas */
.context { max-width: 1000px; margin-top: 16px; }
details.ctx { border-top: 1px solid var(--border); }
details.ctx > summary { list-style: none; cursor: pointer; padding: 4px 0; }
details.ctx > summary::-webkit-details-marker { display: none; }
details.ctx > summary h2 { display: inline-flex; gap: 8px; align-items: center; margin: 10px 0; }
details.ctx > summary h2::before { content: "›"; color: var(--muted); transition: transform 0.15s; display: inline-block; }
details.ctx[open] > summary h2::before { transform: rotate(90deg); }
details.ctx[open] { padding-bottom: 14px; }
.count { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; }
details.ctx.asks > summary h2 { color: var(--ask); }
details.ctx.asks .count { color: var(--ask); border-color: var(--ask); }
.qs { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: q; }
.qs li { counter-increment: q; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--ask); border-radius: 10px; padding: 10px 14px; }
.q { font-size: 14.5px; font-weight: 600; }
.q::before { content: counter(q) ". "; color: var(--ask); }
.options { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.option { font-size: 12.5px; border: 1px solid color-mix(in srgb, var(--ask) 40%, var(--border)); background: var(--ask-bg); border-radius: 999px; padding: 1px 10px; }
.node-link { border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.node-link::before { content: "↗ "; }
.node-link:hover { color: var(--accent); }
.phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.phase { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.phase h3 { display: flex; align-items: center; gap: 8px; }
.phase .tally { margin-left: auto; }
.phase.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.ds { list-style: none; padding: 0; display: grid; gap: 10px; margin: 0; }
.ds li { border-left: 3px solid var(--border); padding: 2px 0 2px 12px; }
.d { font-weight: 600; }
.why { color: var(--muted); font-size: 13px; }
.why-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
.diag { padding: 8px 12px; border-left: 3px solid var(--breaking); background: var(--surface); border-radius: 0 8px 8px 0; margin: 6px 0; font-size: 13px; }
.diag.warning { border-color: var(--migration); }
.glossary { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0; color: var(--muted); }

/* conversation sidebar */
.chat { border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.chat-head { padding: 14px 16px 10px; font-weight: 700; border-bottom: 1px solid var(--border); }
.msgs { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--muted); font-size: 12.5px; margin: 0; }
.msg { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.msg.queued { border: 1px dashed var(--border); background: transparent; }
.who { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.composer { border-top: 1px solid var(--border); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.about { font-size: 12px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.composer textarea { width: 100%; resize: vertical; font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
@media (prefers-color-scheme: dark) { .btn { color: #10152a; } }
.btn.quiet { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* phones */
@media (max-width: 900px) {
  .chat { position: static; height: auto; border-left: 0; border-top: 1px solid var(--border); }
  .viewport { height: 62vh; min-height: 380px; }
  .legend .hint { margin-left: 0; }
  .controls, .search, .search input { width: 100%; }
  .tile { min-width: 0; flex: 1 1 88px; }
}

/* gaps: where the code differs from the model */
.gaps { display: grid; gap: 3px; margin: 6px 0 0; }
.gap { font-size: 11.5px; line-height: 1.4; padding: 4px 7px; border: 1px dashed var(--border-strong, var(--faint)); border-radius: 6px; color: var(--muted); }
.gap-label { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); margin-right: 5px; }
.gap .linklike { font-weight: 600; color: var(--text); }
.gap-note { display: block; }
.badge.hub { color: var(--k-contract); border-color: color-mix(in srgb, var(--k-contract) 40%, transparent); }

</style>

<script type="text/plain" id="plan-outline">
# plan: seams, mapped with seams (learn)
# intent: Use seams on its own repo to see what can be made better.
# describes: the system as it is
#
# rules the code must follow:
# - a module touches only its own tables; other modules' data is reached through their contract
# - a module calls only contracts listed in its `uses` line
# - contract types never expose a table type
# - each contract operation, event and type exists in code with this shape; `!` lists the errors it can return
# - a sub-module (indented module) is internal to its parent: only the parent and its siblings may use its contract
# - an aggregate is loaded and saved whole through its root; its other tables have no repository of their own,
#   and the invariants listed under it hold whenever it is saved
# - a store lists the physical tables a module owns; each `served by` is the key or index a lookup must use,
#   and `SCAN` marks a lookup with none
# - an endpoint only parses, authorises (`auth`) and calls the operations after `->`; no logic of its own
# - a gap is a dependency the code has and the model leaves out; do not add new ones, and remove one when the code stops needing it
# - after building, `seams verify <plan> --tree proposed` must pass; if the code had to differ, change the plan, not just the code
# - a port is an interface the module owns and receives as a dependency; never import its adapter directly
# - each signal is emitted where `on` says, with exactly the listed fields; no secrets, and metric labels stay low-cardinality
# - each test proves what `covers` names, replacing only what `fakes` names; tests marked (planned) are to be written
# - [stub] modules are named only; their insides are not specified

module [Model] — The plan's node types, the helpers plans are written with, stable node ids, and the tree walk every other part uses.
  src: src/ast.ts, src/dsl.ts, src/ids.ts, src/walk.ts, src/doc.ts, src/normalize.ts, src/types.ts
  uses: nothing
  contract [Model/contract/Model]
    type [Model/contract/Model/type/Plan] = { name: string }
    type [Model/contract/Model/type/PlanDocument] = { title: string }
    type [Model/contract/Model/type/Placed] = { path: string }
    query [Model/contract/Model/Walk] (plan: Model.Plan) => Placed
    query [Model/contract/Model/Normalize] (doc: PlanDocument) => PlanDocument
    query [Model/contract/Model/TypeLabel] (type: Plan) => string
  test [Model/test/an older document missing newer parts loads with them filled in] unit covers Model.Normalize
  test [Model/test/types print one way] unit covers Model.TypeLabel
module [Storage] — Decides which key or index serves each lookup, and what column type a field gets.
  src: src/storage.ts
  uses: Model
  contract [Storage/contract/Storage]
    type [Storage/contract/Storage/type/Access] = { label: string, servedBy: string | null }
    query [Storage/contract/Storage/AccessPatterns] (module: Model.Plan) => Access
    query [Storage/contract/Storage/SqlType] (type: Model.Plan) => string
module [Rules] — The checker: whether a plan is consistent with itself. Boundaries, cycles, storage, endpoints, wiring, signals, tests.
  src: src/check.ts
  uses: Model; Storage
  contract [Rules/contract/Rules]
    type [Rules/contract/Rules/type/Diagnostic] = { level: string, at: string, message: string }
    query [Rules/contract/Rules/Check] (plan: Model.Plan) => Diagnostic
    query [Rules/contract/Rules/IndexPlan] (plan: Model.Plan) => Model.Plan
    query [Rules/contract/Rules/DependencyGraph] (plan: Model.Plan) => Model.Plan
  test [Rules/test/the tangled example breaks the boundary rules] unit covers Rules.Check
  test [Rules/test/signals must hang off something real and leak nothing] unit covers Rules.Check
module [Verify] — Holds one tree of a plan to a repository: sources, imports between module folders, the Prisma schema, operations.
  src: src/verify.ts
  uses: Model; Rules
  contract [Verify/contract/Verify]
    type [Verify/contract/Verify/type/Finding] = { level: string, at: string, message: string }
    query [Verify/contract/Verify/Verify] (plan: Model.Plan, root: string) => Finding
  port [Verify/port/Files] exists(path); isDir(path); list(dir); read(file) adapters prod=diskFiles test=memoryFiles — Reads the repository being verified.
  test [Verify/test/an import with no declared dependency is drift, unless the plan names it as a gap] unit covers Verify.Verify fakes Files
  test [Verify/test/new operations must point at their code] unit covers Verify.Verify fakes Files
module [Views] — Everything derived from a plan as text: the cost-tagged diff, the agent outline, the code skeleton, the spec and Mermaid diagrams.
  src: src/views/
  note: Plain-text views print types with Model's typeLabel. The page and the skeleton keep their own walkers because they resolve references as they go.
  uses: Model; Rules; Storage
  contract [Views/contract/Views]
    type [Views/contract/Views/type/Change] = { tag: string, what: string, node: string }
    query [Views/contract/Views/Diff] (before: Model.Plan, after: Model.Plan) => Change
    query [Views/contract/Views/Outline] (doc: Model.PlanDocument) => string
    query [Views/contract/Views/Skeleton] (plan: Model.Plan) => string
    query [Views/contract/Views/Spec] (plan: Model.Plan) => string
    query [Views/contract/Views/SystemDiagram] (plan: Model.Plan) => string
  test [Views/test/the worked change is tagged by cost] unit covers Views.Diff
  test [Views/test/the outline states the rules and every node by id] unit covers Views.Outline
module [Page] — Turns a document into one self-contained HTML page, and reads the document back out of it.
  src: src/render/
  note: client.js is about 1,250 lines of hand-written DOM code. Tests cover the round trip, not the drawing; the drawing is checked by screenshots by hand.
  uses: Model; Rules; Views; Storage
  contract [Page/contract/Page]
    query [Page/contract/Page/RenderDocument] (doc: Model.PlanDocument) => string
    query [Page/contract/Page/ReadDocument] (html: Model.Plan) => Model.PlanDocument
  test [Page/test/a rendered page carries the document, and reads back the same] unit covers Page.RenderDocument, Page.ReadDocument
module [Cli] — The seams command. Loads a document from .ts, .json or .html and calls the other modules.
  src: src/cli.ts, install.sh
  uses: Model; Rules; Page; Views; Verify
  endpoint [Cli/endpoint/seams new] cli seams new auth(public, none) -> Model.Walk
  endpoint [Cli/endpoint/seams where] cli seams where auth(public, none) -> Model.Walk
  endpoint [Cli/endpoint/seams update] cli seams update auth(public, none) -> Model.Walk
  endpoint [Cli/endpoint/seams render] cli seams render auth(public, none) -> Page.RenderDocument
  endpoint [Cli/endpoint/seams check] cli seams check auth(public, none) -> Rules.Check
  endpoint [Cli/endpoint/seams read] cli seams read auth(public, none) -> Page.ReadDocument
  endpoint [Cli/endpoint/seams verify] cli seams verify auth(public, none) -> Verify.Verify
  endpoint [Cli/endpoint/seams skeleton] cli seams skeleton auth(public, none) -> Views.Skeleton
  port [Cli/port/Git] [imported directly] pull --ff-only; rev-parse --short HEAD adapters prod=git (execFileSync) — Pulls the latest version for `seams update`.
module [Skill] [stub] — Tells the agent how to map a repo into a plan, check it, verify it and build from it.
  src: skills/seams/SKILL.md
  uses: nothing
module [Examples] [stub] — The worked shop example and the Documenso plan, and run.ts which regenerates out/.
  src: examples/, plans/documenso-delegation.plan.ts, run.ts
  uses: Rules; Views; Page
</script>

ery node by id","level":"unit","covers":[{"label":"Views.Outline","ref":"Views/contract/Views/Outline"}],"fakes":[],"exists":true,"sources":["test/render.test.ts (the outline states the rules)"]}],"gaps":[],"modules":[]},{"id":"Page","name":"Page","purpose":"Turns a document into one self-contained HTML page, and reads the document back out of it.","depth":"mapped","note":"client.js is about 1,250 lines of hand-written DOM code. Tests cover the round trip, not the drawing; the drawing is checked by screenshots by hand.","sources":["src/render/"],"usedBy":["Cli","Examples"],"contracts":[{"id":"Page/contract/Page","name":"Page","sources":[],"types":[],"operations":[{"id":"Page/contract/Page/RenderDocument","name":"RenderDocument","mode":"query","input":[{"name":"doc","type":[{"s":"Model.PlanDocument","ref":"Model/contract/Model/type/PlanDocument"}]}],"output":[{"s":"string"}],"errors":[]},{"id":"Page/contract/Page/ReadDocument","name":"ReadDocument","mode":"query","input":[{"name":"html","type":[{"s":"Model.Plan","ref":"Model/contract/Model/type/Plan"}]}],"output":[{"s":"Model.PlanDocument","ref":"Model/contract/Model/type/PlanDocument"}],"errors":[]}],"events":[]}],"aggregates":[],"entities":[],"stores":[],"endpoints":[],"ports":[],"signals":[],"tests":[{"id":"Page/test/a rendered page carries the document, and reads back the same","name":"a rendered page carries the document, and reads back the same","level":"unit","covers":[{"label":"Page.RenderDocument","ref":"Page/contract/Page/RenderDocument"},{"label":"Page.ReadDocument","ref":"Page/contract/Page/ReadDocument"}],"fakes":[],"exists":true,"sources":["test/render.test.ts (a rendered page carries the document)"]}],"gaps":[],"modules":[]},{"id":"Cli","name":"Cli","purpose":"The seams command. Loads a document from .ts, .json or .html and calls the other modules.","depth":"mapped","sources":["src/cli.ts","install.sh"],"usedBy":[],"contracts":[],"aggregates":[],"entities":[],"stores":[],"endpoints":[{"id":"Cli/endpoint/seams new","name":"seams new","protocol":"cli","path":"seams new","auth":"none","audience":"public","sources":["src/cli.ts (\"new\")"],"calls":[{"label":"Model.Walk","ref":"Model/contract/Model/Walk"}]},{"id":"Cli/endpoint/seams where","name":"seams where","protocol":"cli","path":"seams where","auth":"none","audience":"public","sources":["src/cli.ts (\"where\")"],"calls":[{"label":"Model.Walk","ref":"Model/contract/Model/Walk"}]},{"id":"Cli/endpoint/seams update","name":"seams update","protocol":"cli","path":"seams update","auth":"none","audience":"public","sources":["src/cli.ts (\"update\")"],"calls":[{"label":"Model.Walk","ref":"Model/contract/Model/Walk"}]},{"id":"Cli/endpoint/seams render","name":"seams render","protocol":"cli","path":"seams render","auth":"none","audience":"public","sources":["src/cli.ts (\"render\")"],"calls":[{"label":"Page.RenderDocument","ref":"Page/contract/Page/RenderDocument"}]},{"id":"Cli/endpoint/seams check","name":"seams check","protocol":"cli","path":"seams check","auth":"none","audience":"public","sources":["src/cli.ts (\"check\")"],"calls":[{"label":"Rules.Check","ref":"Rules/contract/Rules/Check"}]},{"id":"Cli/endpoint/seams read","name":"seams read","protocol":"cli","path":"seams read","auth":"none","audience":"public","sources":["src/cli.ts (\"read\")"],"calls":[{"label":"Page.ReadDocument","ref":"Page/contract/Page/ReadDocument"}]},{"id":"Cli/endpoint/seams verify","name":"seams verify","protocol":"cli","path":"seams verify","auth":"none","audience":"public","sources":["src/cli.ts (\"verify\")"],"calls":[{"label":"Verify.Verify","ref":"Verify/contract/Verify/Verify"}]},{"id":"Cli/endpoint/seams skeleton","name":"seams skeleton","protocol":"cli","path":"seams skeleton","auth":"none","audience":"public","sources":["src/cli.ts (\"skeleton\")"],"calls":[{"label":"Views.Skeleton","ref":"Views/contract/Views/Skeleton"}]}],"ports":[{"id":"Cli/port/Git","name":"Git","purpose":"Pulls the latest version for `seams update`.","methods":["pull --ff-only","rev-parse --short HEAD"],"injected":false,"adapters":[{"name":"git (execFileSync)","env":"prod"}],"sources":["src/cli.ts (execFileSync)"]}],"signals":[],"tests":[],"gaps":[],"modules":[]},{"id":"Skill","name":"Skill","purpose":"Tells the agent how to map a repo into a plan, check it, verify it and build from it.","depth":"stub","sources":["skills/seams/SKILL.md"],"usedBy":[],"contracts":[],"aggregates":[],"entities":[],"stores":[],"endpoints":[],"ports":[],"signals":[],"tests":[],"gaps":[],"modules":[]},{"id":"Examples","name":"Examples","purpose":"The worked shop example and the Documenso plan, and run.ts which regenerates out/.","depth":"stub","sources":["examples/","plans/documenso-delegation.plan.ts","run.ts"],"usedBy":[],"contracts":[],"aggregates":[],"entities":[],"stores":[],"endpoints":[],"ports":[],"signals":[],"tests":[],"gaps":[],"modules":[]}],"edges":[{"from":"Storage","to":"Model/contract/Model","kind":"call"},{"from":"Rules","to":"Model/contract/Model","kind":"call"},{"from":"Rules","to":"Storage/contract/Storage","kind":"call"},{"from":"Verify","to":"Model/contract/Model","kind":"call"},{"from":"Verify","to":"Rules/contract/Rules","kind":"call"},{"from":"Views","to":"Model/contract/Model","kind":"call"},{"from":"Views","to":"Rules/contract/Rules","kind":"call"},{"from":"Views","to":"Storage/contract/Storage","kind":"call"},{"from":"Page","to":"Model/contract/Model","kind":"call"},{"from":"Page","to":"Rules/contract/Rules","kind":"call"},{"from":"Page","to":"Views/contract/Views","kind":"call"},{"from":"Page","to":"Storage/contract/Storage","kind":"call"},{"from":"Cli/endpoint/seams new","to":"Model/contract/Model/Walk","kind":"route"},{"from":"Cli/endpoint/seams where","to":"Model/contract/Model/Walk","kind":"route"},{"from":"Cli/endpoint/seams update","to":"Model/contract/Model/Walk","kind":"route"},{"from":"Cli/endpoint/seams render","to":"Page/contract/Page/RenderDocument","kind":"route"},{"from":"Cli/endpoint/seams check","to":"Rules/contract/Rules/Check","kind":"route"},{"from":"Cli/endpoint/seams read","to":"Page/contract/Page/ReadDocument","kind":"route"},{"from":"Cli/endpoint/seams verify","to":"Verify/contract/Verify/Verify","kind":"route"},{"from":"Cli/endpoint/seams skeleton","to":"Views/contract/Views/Skeleton","kind":"route"},{"from":"Cli","to":"Model/contract/Model","kind":"call"},{"from":"Cli","to":"Rules/contract/Rules","kind":"call"},{"from":"Cli","to":"Page/contract/Page","kind":"call"},{"from":"Cli","to":"Views/contract/Views","kind":"call"},{"from":"Cli","to":"Verify/contract/Verify","kind":"call"},{"from":"Examples","to":"Rules/contract/Rules","kind":"call"},{"from":"Examples","to":"Views/contract/Views","kind":"call"},{"from":"Examples","to":"Page/contract/Page","kind":"call"}],"diagnostics":[{"level":"warning","at":"Cli / port Git","message":"is imported directly, so a test can't swap it; pass it in as a dependency"}]},"proposed":null,"changes":[]}</script>
<script>
// In-page renderer for a plan document. Reads #plan-doc and #plan-view and
// draws the standard layout. No dependencies, no network.
//
// One canvas holds everything about structure: modules as cards laid out as
// a graph (springs along dependencies, repulsion between cards), contracts
// and stored data as rows that expand in place, types that open as cards
// where they are defined and wire back to every visible use. Changes are
// shown on the node they affect. Everything starts collapsed. Context
// (phases, questions, decisions) sits below in collapsible sections; the
// sidebar is only for the conversation.
(() => {
  "use strict";
  const doc = JSON.parse(document.getElementById("plan-doc").textContent);
  const view = JSON.parse(document.getElementById("plan-view").textContent);
  const TAGS = ["breaking", "migration", "additive", "internal"];
  const NOTES_KEY = `plan-notes:${doc.title}`;

  const state = {
    tab: view.proposed ? "change" : "current",
    open: new Set(),
    selected: null,
    phase: null,
    hover: null,
    notes: loadNotes(),
    draft: "",
    pos: loadPos(),            // module id -> card centre, in canvas units
    view: { x: 0, y: 0, k: 1 }, // pan and zoom of the canvas
    fitted: false,
    ctxOpen: new Set(["questions"]), // which context sections below the canvas are open
    only: null,                // show only changes with this tag
  };
  const GLOSSARY = doc.glossary || [];

  // ---- DOM helpers ------------------------------------------------------------
  const SVG = "http://www.w3.org/2000/svg";
  const h = (tag, attrs, ...kids) => fill(document.createElement(tag), attrs, kids);
  const s = (tag, attrs, ...kids) => fill(document.createElementNS(SVG, tag), attrs, kids);
  function fill(el, attrs, kids) {
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  }
  const cls = (...xs) => xs.filter(Boolean).join(" ");

  // ---- tree lookups -----------------------------------------------------------
  const tree = () => (state.tab === "current" ? view.current : view.proposed);

  // Every module in the tree, sub-modules included.
  const everyModule = (ms) => ms.flatMap((m) => [m, ...everyModule(m.modules)]);

  function allIds(t) {
    const out = new Set();
    for (const m of everyModule(t.modules)) {
      out.add(m.id);
      for (const c of m.contracts) {
        out.add(c.id);
        for (const x of [...c.operations, ...c.events, ...c.types]) out.add(x.id);
      }
      for (const e of m.entities) out.add(e.id);
      for (const a of m.aggregates) out.add(a.id);
      for (const st of m.stores) { out.add(st.id); for (const tb of st.tables) out.add(tb.id); }
      for (const ep of m.endpoints) out.add(ep.id);
      for (const x of [...m.ports, ...m.signals, ...m.tests]) out.add(x.id);
    }
    return out;
  }

  // A change is shown on the deepest node that exists in the tree being drawn.
  function placeOf(change, ids) {
    let id = change.node;
    while (id && !ids.has(id)) id = id.includes("/") ? id.slice(0, id.lastIndexOf("/")).replace(/\/(contract|entity|type|aggregate|store|endpoint)$/, "") : null;
    return id || change.module;
  }

  const under = (id, n) => id === n || id.startsWith(n + "/");
  const phaseNodes = () => (state.phase == null ? null : doc.slices[state.phase].nodes);
  const changeInPhase = (c, nodes) => nodes.some((n) => under(c.node, n) || c.module === n);
  const nodeInPhase = (id) => {
    const nodes = phaseNodes();
    return !nodes || nodes.some((n) => under(id, n) || under(n, id));
  };

  function changesByPlace() {
    const map = new Map();
    if (state.tab !== "change") return map;
    const ids = allIds(tree());
    const nodes = phaseNodes();
    for (const c of view.changes) {
      if (nodes && !changeInPhase(c, nodes)) continue;
      if (c.tag === "internal") continue; // drawn as new wires instead
      if (state.only && c.tag !== state.only) continue;
      const p = placeOf(c, ids);
      if (!map.has(p)) map.set(p, []);
      map.get(p).push(c);
    }
    return map;
  }
  const worst = (cs) => TAGS.find((t) => cs.some((c) => c.tag === t));

  // In the change view, everything a change touches starts open.
  function openChanged() {
    const ids = allIds(view.proposed);
    for (const c of view.changes) {
      const p = placeOf(c, ids);
      const parts = p.split("/");
      for (let i = 2; i <= parts.length; i++) state.open.add(parts.slice(0, i).join("/"));
    }
  }

  // ---- interactions -------------------------------------------------------------
  function select(id) {
    state.selected = state.selected === id ? null : id;
    render();
  }
  function toggle(id) {
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    state.selected = id;
    render();
  }
  // Open a referenced type or table where it is defined, then point at it.
  function reveal(ref) {
    const typeAt = ref.indexOf("/type/");
    if (typeAt >= 0) state.open.add(ref.slice(0, typeAt));
    const parts = ref.split("/");
    for (let i = 2; i <= parts.length; i++) state.open.add(parts.slice(0, i).join("/"));
    // A table opens inside its store; an endpoint may sit past the fold.
    const store = ref.match(/^(.*\/store\/[^/]+)\//);
    if (store) state.open.add(store[1]);
    if (ref.includes("/endpoint/")) state.open.add(ref.split("/endpoint/")[0] + "/endpoints");
    state.open.add(ref);
    state.selected = ref;
    render();
    const el = document.querySelector(`[data-node-id="${CSS.escape(ref)}"]`);
    if (el) {
      centerOn(el);
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 900);
    }
  }
  function hover(ref) {
    state.hover = ref;
    document.querySelectorAll(".hot-type").forEach((el) => el.classList.remove("hot-type"));
    if (ref) document.querySelectorAll(`[data-ref="${CSS.escape(ref)}"], [data-node-id="${CSS.escape(ref)}"]`).forEach((el) => el.classList.add("hot-type"));
    drawWires();
  }
  // "Orders/contract/Orders/CancelOrder" reads as "Orders › CancelOrder".
  const pretty = (id) => id.split(/\/(?:contract|entity|type|aggregate|store|endpoint)\/|\//)
    .filter((p, i, xs) => p !== xs[i - 1]).join(" › ").replace(/\u2215/g, "/");

  // When something is selected, the cards it has nothing to do with step back.
  function focusSet() {
    const sel = state.selected;
    if (!sel) return null;
    const top = (id) => id.split("/")[0];
    const out = new Set([top(sel)]);
    for (const e of tree().edges) {
      if (under(e.from, sel) || under(e.to, sel) || under(sel, e.to)) { out.add(top(e.from)); out.add(top(e.to)); }
    }
    return out;
  }
  const filteredOut = (id, ctx) => state.tab === "change" && state.only && !allChangesIn(id, ctx).length;

  // ---- canvas -------------------------------------------------------------------
  function canvas() {
    const t = tree();
    const ctx = { placed: changesByPlace(), focus: focusSet() };
    const tool = (label, title, fn) => h("button", { class: "tool", title, "aria-label": title, onclick: fn }, label);
    const legend = h("div", { class: "legend" },
      h("span", { class: "lg-call" }, "calls"), h("span", { class: "lg-event" }, "reacts to event"),
      h("span", { class: "lg-type" }, "uses type"),
      h("span", { class: "lg-route" }, "endpoint calls (on hover)"),
      state.tab === "change" ? h("span", { class: "lg-new" }, "new dependency") : null,
      state.tab === "change" ? TAGS.slice(0, 3).map((x) => h("span", { class: `lg-tag ${x}` }, x)) : null,
      h("span", { class: "hint" }, h("kbd", {}, "/"), " search ", h("kbd", {}, "esc"), " clear ", h("kbd", {}, "f"), " fit ",
        doc.slices.length ? [h("kbd", {}, `1–${doc.slices.length}`), " phases "] : null, "· drag to pan · ctrl + scroll to zoom"));
    const viewport = h("div", { class: "viewport", id: "viewport" },
      h("div", { class: "layer", id: "layer", style: layerTransform() },
        // Dependencies run under the cards; type links run over them, since
        // they start inside a card.
        s("svg", { class: "wires under", id: "wires", width: 1, height: 1, "aria-hidden": "true" }),
        t.modules.map((m) => moduleCard(m, ctx)),
        s("svg", { class: "wires over", id: "type-wires", width: 1, height: 1, "aria-hidden": "true" })),
      h("div", { class: "tools" },
        tool("Fit", "Fit everything in view", fit),
        tool("+", "Zoom in", () => zoomAt(1.25)),
        tool("−", "Zoom out", () => zoomAt(0.8)),
        state.tab === "change" ? tool("Open changes", "Open everything the change touches", () => { openChanged(); render(); }) : null,
        tool("Collapse", "Collapse everything", () => { state.open.clear(); render(); }),
        tool("Re-arrange", "Lay the graph out again", () => { state.pos = new Map(); savePos(); state.fitted = false; render(); })));
    panZoom(viewport);
    return h("div", { class: "canvas-wrap" }, viewport, legend);
  }

  // ---- graph layout ---------------------------------------------------------------
  // Modules are placed by a small force simulation: springs along every
  // relationship (calls, events, shared types), repulsion between all cards,
  // and overlap removal using each card's real size. Cards a person dragged
  // stay where they were put. Expanding a card re-runs a short, gentle pass so
  // its neighbours make room without the whole graph moving.
  function links(t) {
    const out = new Map();
    const add = (a, b, w) => {
      if (!a || !b || a === b) return;
      const k = a < b ? `${a}|${b}` : `${b}|${a}`;
      out.set(k, { a, b, w: Math.max(out.get(k)?.w || 0, w) });
    };
    const mod = (id) => id.split("/")[0];
    for (const e of t.edges) add(mod(e.from), mod(e.to), 1);
    for (const m of everyModule(t.modules)) {
      const refs = [];
      for (const c of m.contracts) {
        for (const o of c.operations) refs.push(...o.input.flatMap((f) => f.type), ...(o.output || []));
        for (const e of c.events) refs.push(...e.payload.flatMap((f) => f.type));
        for (const ty of c.types) refs.push(...(ty.fields || []).flatMap((f) => f.type));
      }
      for (const e of m.entities) refs.push(...e.fields.flatMap((f) => f.type));
      for (const r of refs) if (r.ref) add(mod(m.id), mod(r.ref), 0.5);
    }
    return [...out.values()];
  }

  function layoutGraph() {
    const layer = document.getElementById("layer");
    if (!layer) return;
    const t = tree();
    const els = [...layer.querySelectorAll(":scope > .card")];
    const nodes = els.map((el) => ({ id: el.getAttribute("data-node-id"), el, w: el.offsetWidth, h: el.offsetHeight }));
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const ls = links(t).filter((l) => byId.has(l.a) && byId.has(l.b));
    const fresh = nodes.filter((n) => !state.pos.has(n.id));
    const placedBefore = nodes.length - fresh.length;
    // New cards start near what they connect to, or on a ring.
    fresh.forEach((n, i) => {
      const near = ls.filter((l) => l.a === n.id || l.b === n.id).map((l) => state.pos.get(l.a === n.id ? l.b : l.a)).filter(Boolean);
      if (near.length) {
        const cx = near.reduce((a, p) => a + p.x, 0) / near.length, cy = near.reduce((a, p) => a + p.y, 0) / near.length;
        state.pos.set(n.id, { x: cx + 200 * Math.cos(i * 2.4), y: cy + 200 * Math.sin(i * 2.4) });
      } else {
        const a = (i / Math.max(1, fresh.length)) * Math.PI * 2;
        const r = 260 + 40 * fresh.length;
        state.pos.set(n.id, { x: r * Math.cos(a), y: r * Math.sin(a) * 0.7 });
      }
    });
    for (const n of nodes) Object.assign(n, state.pos.get(n.id));
    const focus = new Set(view.changes.map((c) => c.module));
    const full = placedBefore === 0;
    simulate(nodes, ls, full ? 500 : 80, full ? 1 : 0.15, focus);
    for (const n of nodes) {
      state.pos.set(n.id, { x: n.x, y: n.y, pinned: state.pos.get(n.id)?.pinned });
      place(n);
    }
    savePos();
  }

  function simulate(nodes, ls, iterations, strength, focus) {
    const PAD = 36;
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const pinned = (n) => state.pos.get(n.id)?.pinned;
    for (let i = 0; i < iterations; i++) {
      const alpha = strength * (1 - i / iterations);
      for (const n of nodes) { n.vx = 0; n.vy = 0; }
      for (const l of ls) {
        const a = byId.get(l.a), b = byId.get(l.b);
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        const rest = (a.w + b.w) / 2 + 140;
        const f = (d - rest) * 0.04 * l.w * alpha;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f;
        b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
      }
      for (let p = 0; p < nodes.length; p++) {
        for (let q = p + 1; q < nodes.length; q++) {
          const a = nodes[p], b = nodes[q];
          const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy + 1, d = Math.sqrt(d2);
          const f = (120000 / d2) * alpha;
          a.vx -= (dx / d) * f; a.vy -= (dy / d) * f;
          b.vx += (dx / d) * f; b.vy += (dy / d) * f;
        }
      }
      for (const n of nodes) {
        const g = (focus.has(n.id.split("/")[0]) ? 0.02 : 0.006) * alpha;

  // ---- domain words -------------------------------------------------------------
  // Glossary terms are underlined wherever prose mentions them; hovering one
  // shows what it means here. One floating tip serves the whole page.
  const termRe = GLOSSARY.length
    ? new RegExp(`\\b(${GLOSSARY.map((g) => g.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length).join("|")})(s|es)?\\b`, "gi")
    : null;
  const termOf = (word) => GLOSSARY.find((g) => g.term.toLowerCase() === word.toLowerCase());
  function terms(text) {
    if (!termRe || !text) return text;
    const out = [];
    let last = 0;
    for (const m of text.matchAll(termRe)) {
      const g = termOf(m[1]);

  // ---- wires --------------------------------------------------------------------
  // Foundation modules: top-level, depending on no other top-level module,
  // and used by at least three and by 60% of the rest. Their wires say little
  // ("everything uses the model") and hide the ones that matter.
  function hubs(t) {
    const top = (id) => id.split("/")[0];
    const out = new Map();
    for (const m of t.modules) {
      const users = new Set(m.usedBy.map(top).filter((u) => u !== m.id));
      const leaf = !t.edges.some((e) => e.kind === "call" && top(e.from) === m.id && top(e.to) !== m.id);
      if (leaf && users.size >= 3 && users.size >= 0.6 * (t.modules.length - 1)) out.set(m.id, users.size);
    }

  }

  function drawWires() {
    const layer = document.getElementById("layer"), svg = document.getElementById("wires"), over = document.getElementById("type-wires");
    if (!layer || !svg || !over) return;
    over.replaceChildren();
    const base = layer.getBoundingClientRect(), k = state.view.k;
    // Positions in canvas units, whatever the current pan and zoom.
    const box = (el) => {
      const r = el.getBoundingClientRect();
      return {
        l: (r.left - base.left) / k, r: (r.right - base.left) / k, t: (r.top - base.top) / k, b: (r.bottom - base.top) / k,
        cx: (r.left + r.width / 2 - base.left) / k, cy: (r.top + r.height / 2 - base.top) / k,
      };
    };
    svg.replaceChildren(s("defs", {},
      s("marker", { id: "ah", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
        s("path", { d: "M0,0 L10,5 L0,10 z", class: "ah" })),
      s("marker", { id: "ah-hot", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
        s("path", { d: "M0,0 L10,5 L0,10 z", class: "ah hot" })),
      s("marker", { id: "ah-route", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" },
        s("path", { d: "M0,0 L10,5 L0,10 z", class: "ah route" }))));
    // The element for a node, or for its nearest ancestor that is on screen
    // (a contract inside a closed sub-module is drawn at the sub-module).
    const find = (id) => {
      for (let x = id; x; x = x.includes("/") ? x.slice(0, x.lastIndexOf("/")) : null) {
        const el = layer.querySelector(`[data-node-id="${CSS.escape(x)}"]`);
        if (el) return el;
      }
      return null;
    };
    // Where a wire may attach. A card offers the middle of all four sides; a
    // row offers the card's left and right edges at the row's height.
    const sides = (el) => {
      if (el.matches(".card")) {
        const b = box(el);
        return [
          { x: b.cx, y: b.t, nx: 0, ny: -1 }, { x: b.cx, y: b.b, nx: 0, ny: 1 },
          { x: b.l, y: b.cy, nx: -1, ny: 0 }, { x: b.r, y: b.cy, nx: 1, ny: 0 },
        ];
      }
      const card = box(el.closest(".card")), row = box(el.querySelector(":scope > .row-head, :scope > .agg-head") || el);
      return [{ x: card.l, y: row.cy, nx: -1, ny: 0 }, { x: card.r, y: row.cy, nx: 1, ny: 0 }];
    };
    // Pick the pair of attachment points that face each other most directly.
    // `shift` slides both ends along their side, so a call and the events
    // coming back between the same two nodes don't sit on one line.
    const link = (fromEl, toEl, shift = 0) => {
      let best = null;
      for (const a of sides(fromEl)) for (const b of sides(toEl)) {
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        // Prefer sides that point towards the other end.
        const facing = (a.nx * dx + a.ny * dy) / d - (b.nx * dx + b.ny * dy) / d;
        const score = d - facing * 120;
        if (!best || score < best.score) best = { a, b, d, score };
      }
      const { d } = best, k = Math.max(30, Math.min(160, d * 0.4));
      const a = { ...best.a, x: best.a.x + best.a.ny * shift, y: best.a.y + best.a.nx * shift };
      const b = { ...best.b, x: best.b.x + best.b.ny * shift, y: best.b.y + best.b.nx * shift };
      return `M${a.x},${a.y} C${a.x + a.nx * k},${a.y + a.ny * k} ${b.x + b.nx * k},${b.y + b.ny * k} ${b.x},${b.y}`;
    };
    const sel = state.selected;
    const before = new Set(view.current.edges.map((e) => `${e.kind} ${e.from} ${e.to}`));
    const hub = hubs(tree());

    for (const e of tree().edges) {
      const call = e.kind === "call";
      // Endpoint -> operation links are many; they appear only for the
      // endpoint or operation being looked at.
      if (e.kind === "route") {
        const live = [sel, state.hover].some((x) => x && (under(e.from, x) || under(e.to, x) || x === e.from));
        if (!live) continue;
        const from = layer.querySelector(`[data-node-id="${CSS.escape(e.from)}"]`), to = find(e.to);
        if (!from || !to || from.closest(".card") === to.closest(".card")) continue;
        svg.append(s("path", { d: link(from, to), class: "wire route hot", "marker-end": "url(#ah-route)" }));
        continue;
      }
      const from = find(e.from), to = find(e.to);
      // A module and what sits inside it are already related by nesting.
      if (!from || !to || from === to || from.contains(to) || to.contains(from)) continue;
      const hot = sel && (under(e.from, sel) || under(e.to, sel) || under(sel, e.to));
      // Calls into a module almost everything uses would cover the map;
      // its card says so instead, and the wires show when it is selected.
      if (call && hub.has(e.to.split("/")[0]) && !hot) continue;
      const fresh = state.tab === "change" && !before.has(`${e.kind} ${e.from} ${e.to}`);
      svg.append(s("path", {
        d: link(from, to, call ? 0 : 10),
        class: cls("wire", call ? "call" : "event", fresh && "new", hot && "hot", sel && !hot && "faded"),
        "marker-end": `url(#${hot ? "ah-hot" : "ah"})`,
      }));
    }

    // Type wires: from each visible use of an open type to its card, when the
    // two are in different cards (inside one card, hover highlighting is enough).
    const chipSides = (el) => {
      const b = box(el);
      return [{ x: b.l, y: b.cy, nx: -1, ny: 0 }, { x: b.r, y: b.cy, nx: 1, ny: 0 }];
    };
    for (const target of layer.querySelectorAll(".typecard, .row.open[data-node-id*='/entity/']")) {
      const id = target.getAttribute("data-node-id");
      const head = target.querySelector(".type-head, .row-head");
      const home = target.closest(".card");
      for (const c of layer.querySelectorAll(`.chip[data-ref="${CSS.escape(id)}"]`)) {
        if (c.closest(".card") === home || c.closest(".type-chips")) continue;
        const hot = state.hover === id || sel === id;
        let best = null;
        for (const a of chipSides(c)) for (const b of chipSides(head)) {
          const d = Math.hypot(b.x - a.x, b.y - a.y);
          if (!best || d < best.d) best = { a, b, d };
        }
        const { a, b, d } = best, k = Math.max(30, Math.min(140, d * 0.4));
        over.append(s("path", {
          d: `M${a.x},${a.y} C${a.x + a.nx * k},${a.y} ${b.x + b.nx * k},${b.y} ${b.x},${b.y}`,
          class: cls("wire", "type", hot && "hot"),
