/* Colour carries two separate meanings and they never share a hue:
   - kind (what a thing is): endpoint cyan, contract indigo, event pink,
     type violet, data slate, storage teal-blue; shown as icon tint, labels
     and thin rules
   - cost of a change: breaking red, migration amber, additive green; shown
     as filled pills, bars and card borders
   Everything else stays neutral, so colour always means something. */
:root {
  --bg: #f5f5f2;
  --surface: #ffffff;
  --surface-2: #f0efea;
  --surface-3: #e7e5df;
  --text: #1b1b19;

  --k-type: #7048c8;
  --k-data: #5c6b7a;
  --k-storage: #1c6e8c;

  --type: var(--k-type);

  --breaking: #c92a2a;
  --migration: #b35c00;
  --additive: #2b8a3e;
  --breaking-bg: #fde8e8;
  --migration-bg: #fff0db;
  --additive-bg: #e3f5e6;
  --ask: #6741d9;
  --ask-bg: #f0ebff;

  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.05);
  color-scheme: light dark;
}

    --surface-3: #31312e;
    --text: #edece8;
    --muted: #a8a7a0;
    --faint: #7c7b75;
    --border: #383834;
    --accent: #8aa4ff;
    --accent-soft: rgba(138, 164, 255, 0.16);

    --k-endpoint: #3bc9db;
    --k-contract: #91a7ff;

    --k-type: #b197fc;
    --k-data: #a5b4c3;

}

* { box-sizing: border-box; }

.muted { color: var(--muted); }

/* shell: main column + thin conversation sidebar */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 290px; min-height: 100vh; }
.main { min-width: 0; padding: 18px 22px 48px; }

/* search */
.search { position: relative; }

.hits { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; width: 380px; max-width: calc(100vw - 32px); list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }

.kind { grid-row: span 2; align-self: start; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding-top: 2px; }
.kind.k-endpoint { color: var(--k-endpoint); }
.kind.k-contract, .kind.k-operation { color: var(--k-contract); }
.kind.k-event { color: var(--k-event); }
.kind.k-type { color: var(--k-type); }
.kind.k-data { color: var(--k-data); }
.kind.k-storage { color: var(--k-storage); }

/* briefing: the page in ten seconds */
.briefing { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px 18px; align-items: start; margin-bottom: 12px; }
@media (max-width: 1100px) { .briefing { grid-template-columns: minmax(0, 1fr); } }
.eyebrow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.ask { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--text); border-radius: 10px; padding: 10px 14px; }
.ask p { font-size: 15px; line-height: 1.45; margin: 2px 0 0; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; min-width: 76px; padding: 6px 11px 7px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; text-align: left; transition: transform 0.1s, box-shadow 0.1s; }
.tile:not(:disabled):hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.tile:disabled { cursor: default; opacity: 0.5; }
.tile .n { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile.breaking .n { color: var(--breaking); }

.tile.breaking.active { background: var(--breaking-bg); border-color: var(--breaking); }

.tile.additive.active { background: var(--additive-bg); border-color: var(--additive); }

.stepper { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.stepper button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 12px 3px 4px; cursor: pointer; font-size: 13px; }
.stepper li:first-child button { padding-left: 12px; }

.step { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--text); font-size: 11.5px; font-weight: 700; flex: none; }

.word { border: 1px solid color-mix(in srgb, var(--ask) 35%, var(--border)); background: var(--surface); color: var(--text); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; cursor: pointer; text-decoration: none; }
.word:hover { background: var(--ask-bg); }

/* domain words in prose, and the one floating tip */
.term { text-decoration: underline dotted color-mix(in srgb, var(--ask) 70%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: help; }
.tip { position: fixed; z-index: 50; background: var(--text); color: var(--bg); font-size: 12.5px; line-height: 1.45; padding: 8px 10px; border-radius: 8px; box-shadow: var(--shadow); pointer-events: none; }
.tip b { color: inherit; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.filter-chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 1px 10px; font-size: 12px; cursor: pointer; }
.filter-chip.breaking { color: var(--breaking); border-color: var(--breaking); }
.filter-chip.migration { color: var(--migration); border-color: var(--migration); }
.filter-chip.additive { color: var(--additive); border-color: var(--additive); }

/* canvas: a pannable, zoomable graph */
.canvas-wrap { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.viewport { position: relative; height: 74vh; min-height: 480px; overflow: hidden; cursor: grab; touch-action: none;
  background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 22px 22px; }

.layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

.wires.under { z-index: 0; }
.wires.over { z-index: 2; }
.tools { position: absolute; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 3; }
.tool { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 2px 9px; cursor: pointer; font-size: 12.5px; min-width: 28px; }
.tool:hover { border-color: var(--accent); color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); align-items: center; }
.legend .hint { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.legend .hint::before { display: none; }
.legend > span::before { content: ""; display: inline-block; width: 18px; height: 0; margin-right: 6px; vertical-align: 3px; border-top: 1.5px solid var(--muted); }

.legend .lg-tag.breaking::before { background: var(--breaking); }
.legend .lg-tag.migration::before { background: var(--migration); }
.legend .lg-tag.additive::before { background: var(--additive); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); transition: opacity 0.15s; }
.card.stub { border-style: dashed; background: color-mix(in srgb, var(--surface) 55%, transparent); box-shadow: none; }

.dim { opacity: 0.32; }

.card-head { padding: 11px 13px 9px; cursor: grab; }
.title { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

.dot.breaking { background: var(--breaking); }
.dot.migration { background: var(--migration); }

.note.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
details.src summary { cursor: pointer; list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* groups inside a card, coloured by kind */
.group { border-top: 1px solid var(--border); --k: var(--muted); }

/* contracts */
.member { padding: 6px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; }

.typecard.hot-type, .row.hot-type { box-shadow: 0 0 0 2px var(--type-soft); }
.type-head { display: flex; justify-content: space-between; align-items: center; }
.type-name { background: none; border: 0; padding: 0; font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--type); cursor: pointer; }
.fields { font-family: var(--mono); font-size: 12px; line-height: 1.75; }
.key { font-family: var(--sans); font-size: 10px; font-weight: 700; color: var(--k-data); margin-left: 6px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
.values { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.value { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; }
.aux { font-size: 12px; color: var(--text); display: flex; flex-wrap: wrap; gap: 3px 5px; align-items: center; margin: 6px 0 2px; }
.aux-label { color: var(--muted); }
.has-facts { flex: none; font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.pill { font-size: 11px; background: var(--surface-2); border-radius: 999px; padding: 0 7px; }

/* aggregates: a consistency boundary around the tables it holds */
.aggregate { margin: 6px 10px 8px; border: 1.5px dashed color-mix(in srgb, var(--k-data) 55%, transparent); border-radius: 9px; overflow: hidden; }
.aggregate .row:first-of-type { border-top-color: transparent; }
.agg-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 10px; background: none; border: 0; cursor: pointer; text-align: left; font-size: 11px; color: var(--k-data); }
.agg-head:hover { background: var(--surface-2); }
.agg-label { flex: 1; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.invariants { margin: 2px 10px 8px; padding-left: 20px; font-size: 12px; }
.invariants li { margin: 3px 0; }
.invariants li::marker { color: var(--k-data); font-weight: 700; }
.aggregate > .changes { padding: 0 10px; }

/* storage */
.store { margin: 6px 10px 8px; border: 1px solid color-mix(in srgb, var(--k-storage) 35%, var(--border)); border-radius: 9px; overflow: hidden; }
.store-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; background: color-mix(in srgb, var(--k-storage) 6%, transparent); border: 0; cursor: pointer; text-align: left; }
.store-name { flex: 1; font-weight: 600; font-size: 13px; }
.engine { flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; padding: 1px 6px; border-radius: 4px; color: #fff; background: var(--k-storage); }
.e-postgres { background: #336791; }
.e-dynamodb { background: #3b48cc; }
.e-mysql { background: #00758f; }
.e-redis { background: #a51d2d; }
.e-s3 { background: #3f8624; }
@media (prefers-color-scheme: dark) { .engine { filter: brightness(1.25); } }
.store .row { --k: var(--k-storage); }
.store > .note { margin: 6px 10px; }
.scan-count { flex: none; font-size: 10.5px; font-weight: 700; color: var(--migration); background: var(--migration-bg); border-radius: 4px; padding: 0 5px; }
.cols { border-collapse: collapse; width: 100%; margin: 4px 0 6px; }
.cols td { padding: 1px 8px 1px 0; vertical-align: baseline; }
.cols tr + tr td { border-top: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
.ctype { color: var(--k-storage); }
.pk { font-family: var(--sans); font-size: 9.5px; font-weight: 700; color: var(--k-data); border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-right: 5px; }
.index { padding: 4px 0; border-top: 1px dashed var(--border); }
.idx-kind { font-family: var(--sans); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--k-storage); margin-right: 4px; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.serves { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.tick { color: var(--additive); font-weight: 700; margin-right: 4px; }
.scans { margin-top: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.store-link { border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--text); display: inline-flex; gap: 2px; align-items: center; }
.store-link:hover { text-decoration: underline; }

/* sub-modules: rows that open into a card nested inside the parent */
.nested { padding: 8px 10px 10px; border-top: 1px solid var(--border); background: var(--surface-2); }
.nested > .card { box-shadow: none; }
.title .x { margin-left: auto; }

.flash { animation: flash 0.9s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 2px var(--accent); } }

/* changes, shown on the node they affect */
.changes { list-style: none; padding: 0; margin: 6px 0 2px; font-size: 12px; }
.changes li { padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
.changes li.internal { color: var(--muted); }
.row > .changes, .store > .changes { padding: 0 13px 6px; margin-top: 0; }
.tag { flex: none; font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.tag.breaking { color: var(--breaking); background: var(--breaking-bg); }
.tag.migration { color: var(--migration); background: var(--migration-bg); }
.tag.additive { color: var(--additive); background: var(--additive-bg); }
.tag.internal { color: var(--muted); background: var(--surface-2); }

/* wires */
.wire { fill: none; stroke: var(--muted); stroke-width: 1.3; opacity: 0.75; }
.wire.event { stroke: var(--k-event); stroke-dasharray: 5 4; opacity: 0.6; }
.wire.type { stroke: var(--type); stroke-dasharray: 2 3; stroke-width: 1.4; opacity: 0.55; }
.wire.new { stroke: var(--additive); opacity: 1; stroke-width: 1.8; }
.wire.hot { stroke: var(--accent); stroke-width: 2.2; opacity: 1; }
.wire.event.hot { stroke: var(--k-event); }
.wire.route.hot { stroke: var(--k-endpoint); stroke-width: 2; }
.wire.type.hot { stroke: var(--type); stroke-dasharray: none; }
.wire.faded { opacity: 0.1; }
.ah { fill: var(--muted); }
.ah.hot { fill: var(--accent); }
.ah.route { fill: var(--k-endpoint); }

/* context below the canvas */
.context { max-width: 1000px; margin-top: 16px; }
details.ctx { border-top: 1px solid var(--border); }
details.ctx > summary { list-style: none; cursor: pointer; padding: 4px 0; }
details.ctx > summary::-webkit-details-marker { display: none; }
details.ctx > summary h2 { display: inline-flex; gap: 8px; align-items: center; margin: 10px 0; }
details.ctx > summary h2::before { content: "›"; color: var(--muted); transition: transform 0.15s; display: inline-block; }
details.ctx[open] > summary h2::before { transform: rotate(90deg); }
details.ctx[open] { padding-bottom: 14px; }
.count { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; }
details.ctx.asks > summary h2 { color: var(--ask); }
details.ctx.asks .count { color: var(--ask); border-color: var(--ask); }
.qs { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: q; }
.qs li { counter-increment: q; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--ask); border-radius: 10px; padding: 10px 14px; }
.q { font-size: 14.5px; font-weight: 600; }
.q::before { content: counter(q) ". "; color: var(--ask); }
.options { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.option { font-size: 12.5px; border: 1px solid color-mix(in srgb, var(--ask) 40%, var(--border)); background: var(--ask-bg); border-radius: 999px; padding: 1px 10px; }
.node-link { border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.node-link::before { content: "↗ "; }
.node-link:hover { color: var(--accent); }
.phases { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.phase { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.phase h3 { display: flex; align-items: center; gap: 8px; }
.phase .tally { margin-left: auto; }
.phase.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
.ds { list-style: none; padding: 0; display: grid; gap: 10px; margin: 0; }
.ds li { border-left: 3px solid var(--border); padding: 2px 0 2px 12px; }
.d { font-weight: 600; }
.why { color: var(--muted); font-size: 13px; }
.why-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
.diag { padding: 8px 12px; border-left: 3px solid var(--breaking); background: var(--surface); border-radius: 0 8px 8px 0; margin: 6px 0; font-size: 13px; }
.diag.warning { border-color: var(--migration); }
.glossary { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0; color: var(--muted); }

/* conversation sidebar */
.chat { border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.chat-head { padding: 14px 16px 10px; font-weight: 700; border-bottom: 1px solid var(--border); }
.msgs { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--muted); font-size: 12.5px; margin: 0; }
.msg { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.msg.queued { border: 1px dashed var(--border); background: transparent; }
.who { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.composer { border-top: 1px solid var(--border); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.about { font-size: 12px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.composer textarea { width: 100%; resize: vertical; font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
@media (prefers-color-scheme: dark) { .btn { color: #10152a; } }
.btn.quiet { background: transparent; color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: default; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* phones */
@media (max-width: 900px) {
  .chat { position: static; height: auto; border-left: 0; border-top: 1px solid var(--border); }
  .viewport { height: 62vh; min-height: 380px; }
  .legend .hint { margin-left: 0; }
  .controls, .search, .search input { width: 100%; }
  .tile { min-width: 0; flex: 1 1 88px; }
}

<script type="text/plain" id="plan-outline">
# plan: Take payment at checkout (plan)
# intent: We're adding card payments to checkout. Orders should only count as placed once the money is captured.
# describes: the system after the change
#
# rules the code must follow:
# - a module touches only its own tables; other modules' data is reached through their contract
# - a module calls only contracts listed in its `uses` line
# - contract types never expose a table type
# - each contract operation, event and type exists in code with this shape; `!` lists the errors it can return
# - a sub-module (indented module) is internal to its parent: only the parent and its siblings may use its contract
# - an aggregate is loaded and saved whole through its root; its other tables have no repository of their own,
#   and the invariants listed under it hold whenever it is saved
# - a store lists the physical tables a module owns; each `served by` is the key or index a lookup must use,
#   and `SCAN` marks a lookup with none
# - an endpoint only parses, authorises (`auth`) and calls the operations after `->`; no logic of its own
# - [stub] modules are named only; their insides are not specified

module [Orders] — Turns a customer's basket into an order and tracks it to completion.
  uses: Catalog; Payments (on PaymentCaptured, PaymentFailed); Customers
  aggregate [Orders/aggregate/Order] root Order + OrderLine
    invariant: Total equals the sum of its lines.
    invariant: Lines cannot change once the order is placed.
    invariant: Status only moves forward: AwaitingPayment, then Paid or PaymentFailed.
  entity [Orders/entity/Order] { id: uuid, customerId: uuid, status: OrderStatus, total: decimal, placedAt: datetime, paymentId: uuid | null } key(id) access get find(customerId) save
  entity [Orders/entity/OrderLine] { id: uuid, orderId: uuid, productId: uuid, quantity: int, unitPrice: decimal } key(id)
  store [Orders/store/orders db] postgres
    table [Orders/store/orders db/Order] "orders" holds Order index (customerId) columns total numeric(12,2)
    table [Orders/store/orders db/OrderLine] "order_lines" holds OrderLine index (orderId)
  served by: Order get by key -> primary key; Order find by customerId -> orders_customerId_idx
  contract [Orders/contract/Orders]
    type [Orders/contract/Orders/type/OrderStatus] = "AwaitingPayment" | "Paid" | "PaymentFailed" | "Cancelled"
    type [Orders/contract/Orders/type/LineInput] = { productId: uuid, quantity: int }
    type [Orders/contract/Orders/type/OrderLineView] = { product: Catalog.ProductSummary, quantity: int, unitPrice: decimal }
    type [Orders/contract/Orders/type/OrderView] = { id: uuid, status: OrderStatus, total: decimal, lines: OrderLineView[] }
    cmd [Orders/contract/Orders/PlaceOrder] (customerId: uuid, lines: LineInput[]) => OrderView ! EmptyOrder | UnknownProduct
    cmd [Orders/contract/Orders/CancelOrder] (id: uuid) => void ! NotFound | AlreadyCancelled | AlreadyPaid
    query [Orders/contract/Orders/GetOrder] (id: uuid) => OrderView ! NotFound
    query [Orders/contract/Orders/ListForCustomer] (customerId: uuid) => OrderView[]
    event [Orders/contract/Orders/OrderPlaced] { orderId: uuid, total: decimal }
    event [Orders/contract/Orders/OrderPaid] { orderId: uuid }
  endpoint [Orders/endpoint/POST ∕orders] http POST /orders auth(public, customer session) -> Orders.PlaceOrder
  endpoint [Orders/endpoint/GET ∕orders∕{id}] http GET /orders/{id} auth(public, customer session) -> Orders.GetOrder
  endpoint [Orders/endpoint/POST ∕orders∕{id}∕cancel] http POST /orders/{id}/cancel auth(public, customer session) -> Orders.CancelOrder
  endpoint [Orders/endpoint/GET ∕customers∕{customerId}∕orders] http GET /customers/{customerId}/orders auth(public, customer session) -> Orders.ListForCustomer
  endpoint [Orders/endpoint/GET ∕orders∕{id}∕payment] http GET /orders/{id}/payment auth(public, customer session) -> Payments.GetStatus
module [Catalog] — Owns what can be sold and at what price.
  uses: nothing
  entity [Catalog/entity/Product] { id: uuid, sku: string, name: string, price: decimal, active: boolean } key(id) access get find(sku) find(active) save
  store [Catalog/store/catalog db] postgres
    table [Catalog/store/catalog db/Product] "products" holds Product index unique (sku) (active)
  served by: Product get by key -> primary key; Product find by sku -> products_sku_idx; Product find by active -> products_active_idx
  contract [Catalog/contract/Catalog]
    type [Catalog/contract/Catalog/type/ProductSummary] = { id: uuid, name: string, price: decimal }
    query [Catalog/contract/Catalog/GetProduct] (id: uuid) => ProductSummary ! NotFound
    query [Catalog/contract/Catalog/ListActive] () => ProductSummary[]
    event [Catalog/contract/Catalog/ProductPriceChanged] { productId: uuid, price: decimal }
module [Payments] — Collects money for an order and reports the outcome. Knows nothing about what was bought.
  uses: Gateway
  entity [Payments/entity/Payment] { id: uuid, orderId: uuid, amount: decimal, status: PaymentStatus, providerRef: string | null, createdAt: datetime } key(id) access get find(orderId) save
  store [Payments/store/payments table] dynamodb
    table [Payments/store/payments table/Payment] "payments" holds Payment pk "PAY#{id}" byOrder(pk "ORDER#{orderId}" sk "AT#{createdAt}")
  served by: Payment get by key -> table key; Payment find by orderId -> byOrder
  contract [Payments/contract/Payments]
    type [Payments/contract/Payments/type/PaymentStatus] = "Pending" | "Captured" | "Failed"
    cmd [Payments/contract/Payments/StartPayment] (orderId: uuid, amount: decimal) => uuid ! AlreadyPaid
    query [Payments/contract/Payments/GetStatus] (orderId: uuid) => PaymentStatus ! NotFound
    event [Payments/contract/Payments/PaymentCaptured] { paymentId: uuid, orderId: uuid }
    event [Payments/contract/Payments/PaymentFailed] { orderId: uuid, reason: string }
  module [Payments/Gateway] — Talks to the card provider. One implementation per provider; nothing outside Payments sees it.
    uses: nothing
    contract [Payments/Gateway/contract/Gateway]
      cmd [Payments/Gateway/contract/Gateway/Charge] (amount: decimal, reference: string) => string ! Declined | ProviderDown
module [Customers] [stub] — Accounts, addresses and sign-in.
  src: src/customers/
  uses: nothing
  contract [Customers/contract/Customers] (not mapped)
module [Notifications] [stub] — Emails and push messages to customers.
  src: src/notify/
  uses: Orders (on OrderPlaced)

changes (from current):
  [Payments] additive: new module
  [Orders/entity/Order] migration: add column paymentId: uuid?
  [Orders/aggregate/Order] internal: new invariant: Status only moves forward: AwaitingPayment, then Paid or PaymentFailed.
  [Orders/endpoint/GET ∕orders∕{id}∕payment] additive: new endpoint
  [Orders] internal: now depends on Payments
  [Orders] internal: now reacts to Payments.PaymentCaptured
  [Orders] internal: now reacts to Payments.PaymentFailed
  [Orders/contract/Orders/type/OrderStatus] breaking: gains value "AwaitingPayment" (exhaustive switches must handle it)
  [Orders/contract/Orders/type/OrderStatus] breaking: gains value "Paid" (exhaustive switches must handle it)
  [Orders/contract/Orders/type/OrderStatus] breaking: gains value "PaymentFailed" (exhaustive switches must handle it)
  [Orders/contract/Orders/type/OrderStatus] breaking: loses value "Placed"
  [Orders/contract/Orders/CancelOrder] breaking: can now fail with AlreadyPaid
  [Orders/contract/Orders/OrderPaid] additive: new event
  [Orders/entity/Order] migration: status: rows with "Placed" must be mapped to a new OrderStatus
  [Orders/entity/Order] migration: status: database enum gains "AwaitingPayment", "Paid", "PaymentFailed"

phases:
  1. Payments on its own: Ship the Payments module with its table and contract. Nothing calls it yet, so it can be tested against the provider in isolation.
     nodes: Payments
  2. Orders takes payment: PlaceOrder starts a payment and the order follows the payment events. Includes the status migration.
     nodes: Orders
     note: Existing Placed orders become Paid: they were taken before payments existed.

decisions:
  [Payments] Payments stores the order id but never calls Orders. (because: Orders depends on Payments, not the other way round. That avoids a cycle and keeps Payments reusable for subscriptions later.)

open questions:
  [Orders/contract/Orders] When a payment fails, should the order be cancelled or left open for the customer to retry? options: Cancel | Keep open for 24h
</script>

kind":"event","label":"PaymentCaptured, PaymentFailed"},{"from":"Orders","to":"Customers/contract/Customers","kind":"call"},{"from":"Payments","to":"Payments/Gateway/contract/Gateway","kind":"call"},{"from":"Notifications","to":"Orders/contract/Orders","kind":"call"},{"from":"Orders/contract/Orders","to":"Notifications","kind":"event","label":"OrderPlaced"}],"diagnostics":[]},"changes":[{"module":"Payments","tag":"additive","what":"new module: Collects money for an order and reports the outcome. Knows nothing about what was bought.","short":"new module","node":"Payments"},{"module":"Orders","tag":"migration","what":"Order: add column paymentId: uuid?","short":"add column paymentId: uuid?","node":"Orders/entity/Order"},{"module":"Orders","tag":"internal","what":"Order: new invariant: Status only moves forward: AwaitingPayment, then Paid or PaymentFailed.","short":"new invariant: Status only moves forward: AwaitingPayment, then Paid or PaymentFailed.","node":"Orders/aggregate/Order"},{"module":"Orders","tag":"additive","what":"new endpoint GET /orders/{id}/payment","short":"new endpoint","node":"Orders/endpoint/GET ∕orders∕{id}∕payment"},{"module":"Orders","tag":"internal","what":"now depends on Payments","node":"Orders"},{"module":"Orders","tag":"internal","what":"now reacts to Payments.PaymentCaptured","node":"Orders"},{"module":"Orders","tag":"internal","what":"now reacts to Payments.PaymentFailed","node":"Orders"},{"module":"Orders","tag":"breaking","what":"Orders: OrderStatus gains value \"AwaitingPayment\" (exhaustive switches must handle it)","short":"gains value \"AwaitingPayment\" (exhaustive switches must handle it)","contract":"Orders","node":"Orders/contract/Orders/type/OrderStatus"},{"module":"Orders","tag":"breaking","what":"Orders: OrderStatus gains value \"Paid\" (exhaustive switches must handle it)","short":"gains value \"Paid\" (exhaustive switches must handle it)","contract":"Orders","node":"Orders/contract/Orders/type/OrderStatus"},{"module":"Orders","tag":"breaking","what":"Orders: OrderStatus gains value \"PaymentFailed\" (exhaustive switches must handle it)","short":"gains value \"PaymentFailed\" (exhaustive switches must handle it)","contract":"Orders","node":"Orders/contract/Orders/type/OrderStatus"},{"module":"Orders","tag":"breaking","what":"Orders: OrderStatus loses value \"Placed\"","short":"loses value \"Placed\"","contract":"Orders","node":"Orders/contract/Orders/type/OrderStatus"},{"module":"Orders","tag":"breaking","what":"Orders: CancelOrder: can now fail with AlreadyPaid","short":"can now fail with AlreadyPaid","contract":"Orders","node":"Orders/contract/Orders/CancelOrder"},{"module":"Orders","tag":"additive","what":"Orders: new event OrderPaid","short":"new event","contract":"Orders","node":"Orders/contract/Orders/OrderPaid"},{"module":"Orders","tag":"migration","what":"Order.status: rows with \"Placed\" must be mapped to a new OrderStatus","short":"status: rows with \"Placed\" must be mapped to a new OrderStatus","node":"Orders/entity/Order"},{"module":"Orders","tag":"migration","what":"Order.status: database enum gains \"AwaitingPayment\", \"Paid\", \"PaymentFailed\"","short":"status: database enum gains \"AwaitingPayment\", \"Paid\", \"PaymentFailed\"","node":"Orders/entity/Order"}]}</script>
<script>
// In-page renderer for a plan document. Reads #plan-doc and #plan-view and
// draws the standard layout. No dependencies, no network.
//
// One canvas holds everything about structure: modules as cards laid out as
// a graph (springs along dependencies, repulsion between cards), contracts
// and stored data as rows that expand in place, types that open as cards
// where they are defined and wire back to every visible use. Changes are
// shown on the node they affect. Everything starts collapsed. Context
// (phases, questions, decisions) sits below in collapsible sections; the
// sidebar is only for the conversation.
(() => {
  "use strict";
  const doc = JSON.parse(document.getElementById("plan-doc").textContent);
  const view = JSON.parse(document.getElementById("plan-view").textContent);
  const TAGS = ["breaking", "migration", "additive", "internal"];
  const NOTES_KEY = `plan-notes:${doc.title}`;

  const state = {
    tab: view.proposed ? "change" : "current",
    open: new Set(),
    selected: null,
    phase: null,
    hover: null,
    notes: loadNotes(),
    draft: "",
    pos: loadPos(),            // module id -> card centre, in canvas units
    view: { x: 0, y: 0, k: 1 }, // pan and zoom of the canvas
    fitted: false,
    ctxOpen: new Set(["questions"]), // which context sections below the canvas are open
    only: null,                // show only changes with this tag
  };
  const GLOSSARY = doc.glossary || [];

  // ---- DOM helpers ------------------------------------------------------------
  const SVG = "http://www.w3.org/2000/svg";
  const h = (tag, attrs, ...kids) => fill(document.createElement(tag), attrs, kids);
  const s = (tag, attrs, ...kids) => fill(document.createElementNS(SVG, tag), attrs, kids);
  function fill(el, attrs, kids) {
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  }
  const cls = (...xs) => xs.filter(Boolean).join(" ");

  // ---- tree lookups -----------------------------------------------------------
  const tree = () => (state.tab === "current" ? view.current : view.proposed);

  // Every module in the tree, sub-modules included.
  const everyModule = (ms) => ms.flatMap((m) => [m, ...everyModule(m.modules)]);

  function allIds(t) {
    const out = new Set();
    for (const m of everyModule(t.modules)) {
      out.add(m.id);
      for (const c of m.contracts) {
        out.add(c.id);
        for (const x of [...c.operations, ...c.events, ...c.types]) out.add(x.id);
      }
      for (const e of m.entities) out.add(e.id);
      for (const a of m.aggregates) out.add(a.id);
      for (const st of m.stores) { out.add(st.id); for (const tb of st.tables) out.add(tb.id); }
      for (const ep of m.endpoints) out.add(ep.id);
    }
    return out;
  }

  // A change is shown on the deepest node that exists in the tree being drawn.
  function placeOf(change, ids) {
    let id = change.node;
    while (id && !ids.has(id)) id = id.includes("/") ? id.slice(0, id.lastIndexOf("/")).replace(/\/(contract|entity|type|aggregate|store|endpoint)$/, "") : null;
    return id || change.module;
  }

  const under = (id, n) => id === n || id.startsWith(n + "/");
  const phaseNodes = () => (state.phase == null ? null : doc.slices[state.phase].nodes);
  const changeInPhase = (c, nodes) => nodes.some((n) => under(c.node, n) || c.module === n);
  const nodeInPhase = (id) => {
    const nodes = phaseNodes();
    return !nodes || nodes.some((n) => under(id, n) || under(n, id));
  };

  function changesByPlace() {
    const map = new Map();
    if (state.tab !== "change") return map;
    const ids = allIds(tree());
    const nodes = phaseNodes();
    for (const c of view.changes) {
      if (nodes && !changeInPhase(c, nodes)) continue;
      if (c.tag === "internal") continue; // drawn as new wires instead
      if (state.only && c.tag !== state.only) continue;
      const p = placeOf(c, ids);
      if (!map.has(p)) map.set(p, []);
      map.get(p).push(c);
    }
    return map;
  }
  const worst = (cs) => TAGS.find((t) => cs.some((c) => c.tag === t));

  // In the change view, everything a change touches starts open.
  function openChanged() {
    const ids = allIds(view.proposed);
    for (const c of view.changes) {
      const p = placeOf(c, ids);
      const parts = p.split("/");
      for (let i = 2; i <= parts.length; i++) state.open.add(parts.slice(0, i).join("/"));
    }
  }

  // ---- interactions -------------------------------------------------------------
  function select(id) {
    state.selected = state.selected === id ? null : id;
    render();
  }
  function toggle(id) {
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    state.selected = id;
    render();
  }
  // Open a referenced type or table where it is defined, then point at it.
  function reveal(ref) {
    const typeAt = ref.indexOf("/type/");
    if (typeAt >= 0) state.open.add(ref.slice(0, typeAt));
    const parts = ref.split("/");
    for (let i = 2; i <= parts.length; i++) state.open.add(parts.slice(0, i).join("/"));
    // A table opens inside its store; an endpoint may sit past the fold.
    const store = ref.match(/^(.*\/store\/[^/]+)\//);
    if (store) state.open.add(store[1]);
    if (ref.includes("/endpoint/")) state.open.add(ref.split("/endpoint/")[0] + "/endpoints");
    state.open.add(ref);
    state.selected = ref;
    render();
    const el = document.querySelector(`[data-node-id="${CSS.escape(ref)}"]`);
    if (el) {
      centerOn(el);
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 900);
    }
  }
  function hover(ref) {
    state.hover = ref;
    document.querySelectorAll(".hot-type").forEach((el) => el.classList.remove("hot-type"));
    if (ref) document.querySelectorAll(`[data-ref="${CSS.escape(ref)}"], [data-node-id="${CSS.escape(ref)}"]`).forEach((el) => el.classList.add("hot-type"));
    drawWires();
  }
  // "Orders/contract/Orders/CancelOrder" reads as "Orders › CancelOrder".
  const pretty = (id) => id.split(/\/(?:contract|entity|type|aggregate|store|endpoint)\/|\//)
    .filter((p, i, xs) => p !== xs[i - 1]).join(" › ").replace(/\u2215/g, "/");

  // When something is selected, the cards it has nothing to do with step back.
  function focusSet() {
    const sel = state.selected;
    if (!sel) return null;
    const top = (id) => id.split("/")[0];
    const out = new Set([top(sel)]);
    for (const e of tree().edges) {
      if (under(e.from, sel) || under(e.to, sel) || under(sel, e.to)) { out.add(top(e.from)); out.add(top(e.to)); }
    }
    return out;
  }
  const filteredOut = (id, ctx) => state.tab === "change" && state.only && !allChangesIn(id, ctx).length;

  // ---- canvas -------------------------------------------------------------------
  function canvas() {
    const t = tree();
    const ctx = { placed: changesByPlace(), focus: focusSet() };
    const tool = (label, title, fn) => h("button", { class: "tool", title, "aria-label": title, onclick: fn }, label);
    const legend = h("div", { class: "legend" },
      h("span", { class: "lg-call" }, "calls"), h("span", { class: "lg-event" }, "reacts to event"),
      h("span", { class: "lg-type" }, "uses type"),
      h("span", { class: "lg-route" }, "endpoint calls (on hover)"),
      state.tab === "change" ? h("span", { class: "lg-new" }, "new dependency") : null,
      state.tab === "change" ? TAGS.slice(0, 3).map((x) => h("span", { class: `lg-tag ${x}` }, x)) : null,
      h("span", { class: "hint" }, h("kbd", {}, "/"), " search ", h("kbd", {}, "esc"), " clear ", h("kbd", {}, "f"), " fit ",
        doc.slices.length ? [h("kbd", {}, `1–${doc.slices.length}`), " phases "] : null, "· drag to pan · ctrl + scroll to zoom"));
    const viewport = h("div", { class: "viewport", id: "viewport" },
      h("div", { class: "layer", id: "layer", style: layerTransform() },
        // Dependencies run under the cards; type links run over them, since
        // they start inside a card.
        s("svg", { class: "wires under", id: "wires", width: 1, height: 1, "aria-hidden": "true" }),
        t.modules.map((m) => moduleCard(m, ctx)),
        s("svg", { class: "wires over", id: "type-wires", width: 1, height: 1, "aria-hidden": "true" })),
      h("div", { class: "tools" },
        tool("Fit", "Fit everything in view", fit),
        tool("+", "Zoom in", () => zoomAt(1.25)),
        tool("−", "Zoom out", () => zoomAt(0.8)),
        state.tab === "change" ? tool("Open changes", "Open everything the change touches", () => { openChanged(); render(); }) : null,
        tool("Collapse", "Collapse everything", () => { state.open.clear(); render(); }),
        tool("Re-arrange", "Lay the graph out again", () => { state.pos = new Map(); savePos(); state.fitted = false; render(); })));
    panZoom(viewport);
    return h("div", { class: "canvas-wrap" }, viewport, legend);
  }

  // ---- graph layout ---------------------------------------------------------------
  // Modules are placed by a small force simulation: springs along every
  // relationship (calls, events, shared types), repulsion between all cards,
  // and overlap removal using each card's real size. Cards a person dragged
  // stay where they were put. Expanding a card re-runs a short, gentle pass so
  // its neighbours make room without the whole graph moving.
  function links(t) {
    const out = new Map();
    const add = (a, b, w) => {
      if (!a || !b || a === b) return;
      const k = a < b ? `${a}|${b}` : `${b}|${a}`;
      out.set(k, { a, b, w: Math.max(out.get(k)?.w || 0, w) });
    };
    const mod = (id) => id.split("/")[0];
    for (const e of t.edges) add(mod(e.from), mod(e.to), 1);
    for (const m of everyModule(t.modules)) {
      const refs = [];
      for (const c of m.contracts) {
        for (const o of c.operations) refs.push(...o.input.flatMap((f) => f.type), ...(o.output || []));
        for (const e of c.events) refs.push(...e.payload.flatMap((f) => f.type));
        for (const ty of c.types) refs.push(...(ty.fields || []).flatMap((f) => f.type));
      }
      for (const e of m.entities) refs.push(...e.fields.flatMap((f) => f.type));
      for (const r of refs) if (r.ref) add(mod(m.id), mod(r.ref), 0.5);
    }
    return [...out.values()];
  }

  function layoutGraph() {
    const layer = document.getElementById("layer");
    if (!layer) return;
    const t = tree();
    const els = [...layer.querySelectorAll(":scope > .card")];
    const nodes = els.map((el) => ({ id: el.getAttribute("data-node-id"), el, w: el.offsetWidth, h: el.offsetHeight }));
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const ls = links(t).filter((l) => byId.has(l.a) && byId.has(l.b));
    const fresh = nodes.filter((n) => !state.pos.has(n.id));
    const placedBefore = nodes.length - fresh.length;
    // New cards start near what they connect to, or on a ring.
    fresh.forEach((n, i) => {
      const near = ls.filter((l) => l.a === n.id || l.b === n.id).map((l) => state.pos.get(l.a === n.id ? l.b : l.a)).filter(Boolean);
      if (near.length) {
        const cx = near.reduce((a, p) => a + p.x, 0) / near.length, cy = near.reduce((a, p) => a + p.y, 0) / near.length;
        state.pos.set(n.id, { x: cx + 200 * Math.cos(i * 2.4), y: cy + 200 * Math.sin(i * 2.4) });
      } else {
        const a = (i / Math.max(1, fresh.length)) * Math.PI * 2;
        const r = 260 + 40 * fresh.length;
        state.pos.set(n.id, { x: r * Math.cos(a), y: r * Math.sin(a) * 0.7 });
      }
    });
    for (const n of nodes) Object.assign(n, state.pos.get(n.id));
    const focus = new Set(view.changes.map((c) => c.module));
    const full = placedBefore === 0;
    simulate(nodes, ls, full ? 500 : 80, full ? 1 : 0.15, focus);
    for (const n of nodes) {
      state.pos.set(n.id, { x: n.x, y: n.y, pinned: state.pos.get(n.id)?.pinned });
      place(n);
    }
    savePos();
  }

  function simulate(nodes, ls, iterations, strength, focus) {
    const PAD = 36;
    const byId = new Map(nodes.map((n) => [n.id, n]));
    const pinned = (n) => state.pos.get(n.id)?.pinned;
    for (let i = 0; i < iterations; i++) {
      const alpha = strength * (1 - i / iterations);
      for (const n of nodes) { n.vx = 0; n.vy = 0; }
      for (const l of ls) {
        const a = byId.get(l.a), b = byId.get(l.b);
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        const rest = (a.w + b.w) / 2 + 140;
        const f = (d - rest) * 0.04 * l.w * alpha;
        a.vx += (dx / d) * f; a.vy += (dy / d) * f;
        b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
      }
      for (let p = 0; p < nodes.length; p++) {
        for (let q = p + 1; q < nodes.length; q++) {
          const a = nodes[p], b = nodes[q];
          const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy + 1, d = Math.sqrt(d2);
          const f = (120000 / d2) * alpha;
          a.vx -= (dx / d) * f; a.vy -= (dy / d) * f;
          b.vx += (dx / d) * f; b.vy += (dy / d) * f;
        }
      }
      for (const n of nodes) {
        const g = (focus.has(n.id.split("/")[0]) ? 0.02 : 0.006) * alpha;
        n.vx -= n.x * g; n.vy -= n.y * g * 1.6;
        if (!pinned(n)) { n.x += clamp(n.vx, 60); n.y += clamp(n.vy, 60); }
      }
      // Overlap removal runs at full strength every step: cards never overlap.
      for (let p = 0; p < nodes.length; p++) {
        for (let q = p + 1; q < nodes.length; q++) {
          const a = nodes[p], b = nodes[q];
          const ox = (a.w + b.w) / 2 + PAD - Math.abs(b.x - a.x);
          const oy = (a.h + b.h) / 2 + PAD - Math.abs(b.y - a.y);
          if (ox <= 0 || oy <= 0) continue;
          const pa = pinned(a) ? 0 : pinned(b) ? 1 : 0.5, pb = 1 - pa;
          if (ox < oy) {
            const sx = Math.sign(b.x - a.x) || 1;
            a.x -= sx * ox * pa; b.x += sx * ox * pb;
          } else {
            const sy = Math.sign(b.y - a.y) || 1;
            a.y -= sy * oy * pa; b.y += sy * oy * pb;
          }
        }
      }
    }
  }
  // Sources and notes stay one or two lines until clicked, so real code with
  // long paths does not push a card's contracts off screen.
  function srcLine(list) {
    if (!list.length) return null;
    if (list.length === 1) return h("p", { class: "src" }, list[0]);
    return h("details", { class: "src", onclick: (ev) => ev.stopPropagation() },
      h("summary", {}, `${list[0]} +${list.length - 1}`),
      ...list.slice(1).map((x) => h("div", {}, x)));
  }
  function noteLine(text) {
    if (!text) return null;
    return h("p", { class: "note clamp", title: "Click to read all",
      onclick: (ev) => { ev.stopPropagation(); ev.currentTarget.classList.toggle("clamp"); drawWires(); } }, text);
  }

  const clamp = (v, m) => Math.max(-m, Math.min(m, v));
  function place(n) {
    n.el.style.left = `${n.x - n.w / 2}px`;
    n.el.style.top = `${n.y - n.h / 2}px`;
    n.el.style.visibility = "visible";
  }

  // ---- pan, zoom, drag ----------------------------------------------------------------
  const layerTransform = () => `transform: translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.k})`;
  function applyView() {
    const layer = document.getElementById("layer");
    if (layer) layer.style.transform = `translate(${state.view.x}px, ${state.view.y}px) scale(${state.view.k})`;
  }
  function zoomAt(f, cx, cy) {
    const vp = document.getElementById("viewport");
    if (!vp) return;
    const r = vp.getBoundingClientRect();
    const px = cx ?? r.width / 2, py = cy ?? r.height / 2;
    const k = Math.max(0.25, Math.min(2.5, state.view.k * f));
    state.view.x = px - ((px - state.view.x) * k) / state.view.k;
    state.view.y = py - ((py - state.view.y) * k) / state.view.k;
    state.view.k = k;
    applyView();
  }
  function fit() {
    const vp = document.getElementById("viewport");
    const cards = [...document.querySelectorAll("#layer > .card")];
    if (!vp || !cards.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const c of cards) {
      const l = parseFloat(c.style.left), t = parseFloat(c.style.top);
      x0 = Math.min(x0, l); y0 = Math.min(y0, t);
      x1 = Math.max(x1, l + c.offsetWidth); y1 = Math.max(y1, t + c.offsetHeight);
    }
    const W = vp.clientWidth, H = vp.clientHeight, M = 32;
    const k = Math.max(0.3, Math.min(1, (W - 2 * M) / (x1 - x0), (H - 2 * M) / (y1 - y0)));
    state.view = { k, x: W / 2 - ((x0 + x1) / 2) * k, y: H / 2 - ((y0 + y1) / 2) * k };
    applyView();
  }
  function centerOn(el) {
    const vp = document.getElementById("viewport");
    if (!vp) return;
    const v = vp.getBoundingClientRect(), r = el.getBoundingClientRect();
    const inside = r.left >= v.left && r.right <= v.right && r.top >= v.top && r.bottom <= v.bottom;
    if (inside) return;
    state.view.x += v.left + v.width / 2 - (r.left + r.width / 2);
    state.view.y += v.top + Math.min(v.height / 2, r.height / 2 + 40) - r.top;
    applyView();
  }

  function panZoom(vp) {
    let drag = null;
    vp.addEventListener("pointerdown", (ev) => {
      if (ev.button !== 0 || ev.target.closest("button, .tools")) return;
      const head = ev.target.closest(".card-head");
      const card = ev.target.closest(".card");
      if (card && !head) return; // clicks inside a card body stay clicks
      drag = { x: ev.clientX, y: ev.clientY, moved: false, card: head ? card : null, start: { ...state.view } };
      if (drag.card) drag.pos = { ...state.pos.get(card.getAttribute("data-node-id")) };
      drag.pointer = ev.pointerId;
    });
    vp.addEventListener("pointermove", (ev) => {
      if (!drag) return;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      if (!drag.moved) vp.setPointerCapture(drag.pointer); // only once it is a drag, so plain clicks still land
      drag.moved = true;
      vp.classList.add("dragging");
      if (drag.card) {
        const id = drag.card.getAttribute("data-node-id");
        const p = { x: drag.pos.x + dx / state.view.k, y: drag.pos.y + dy / state.view.k, pinned: true };
        state.pos.set(id, p);
        place({ el: drag.card, x: p.x, y: p.y, w: drag.card.offsetWidth, h: drag.card.offsetHeight });
      } else {
        state.view.x = drag.start.x + dx;
        state.view.y = drag.start.y + dy;
        applyView();
      }
      drawWires();
    });
    const end = () => {
      if (drag?.moved) {
        if (drag.card) { layoutGraph(); drawWires(); } // neighbours make room around where it was dropped
        savePos();
        // Swallow the click that ends a drag so it doesn't select the card.
        vp.addEventListener("click", (e) => e.stopPropagation(), { capture: true, once: true });
      }
      drag = null;
      vp.classList.remove("dragging");
    };
    vp.addEventListener("pointerup", end);
    vp.addEventListener("pointercancel", end);
    vp.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const r = vp.getBoundingClientRect();
      if (ev.ctrlKey || ev.metaKey) zoomAt(Math.exp(-ev.deltaY * 0.01), ev.clientX - r.left, ev.clientY - r.top);
      else { state.view.x -= ev.deltaX; state.view.y -= ev.deltaY; applyView(); }
    }, { passive: false });
  }

  function loadPos() {
    try { return new Map(JSON.parse(localStorage.getItem(`plan-pos:${doc.title}`) || "[]")); } catch { return new Map(); }
  }
  function savePos() {
    try { localStorage.setItem(`plan-pos:${doc.title}`, JSON.stringify([...state.pos])); } catch { /* storage unavailable */ }
  }

  function changeList(cs) {
    if (!cs || !cs.length) return null;
    return h("ul", { class: "changes" }, [...cs].sort((a, b) => TAGS.indexOf(a.tag) - TAGS.indexOf(b.tag)).map((c) =>
      h("li", { class: c.tag }, h("span", { class: `tag ${c.tag}` }, c.tag), c.short || c.what)));
  }

  // "2 breaking · 1 migration", as coloured counts, for a card's header.
  function tally(cs) {
    const counts = TAGS.slice(0, 3).map((t) => [t, cs.filter((c) => c.tag === t).length]).filter(([, n]) => n);
    if (!counts.length) return null;
    return h("span", { class: "tally", title: counts.map(([t, n]) => `${n} ${t}`).join(", ") },
      counts.map(([t, n]) => h("span", { class: `dot ${t}` }, String(n))));
  }

  const facts = (id) => (doc.facts[id] || []).map((f) =>
    h("span", { class: "fact", title: f.detail || "" }, `${f.label} `, h("b", {}, String(f.value))));

  // A card is read top to bottom in the order a request travels: how you get
  // in (endpoints), what it promises (contracts), what it keeps (data), where
  // that lives (storage), and what is inside it (sub-modules).
  function moduleCard(m, ctx, close) {
    const cs = ctx.placed.get(m.id);
    const all = state.tab === "change" ? allChangesIn(m.id, ctx) : [];
    const tagged = worst(all);
    const focus = ctx.focus;
    const loose = m.entities.filter((e) => !m.aggregates.some((a) => a.root === e.id || a.members.includes(e.id)));
    return h("article", {
      class: cls("card", m.depth === "stub" && "stub", tagged && tagged !== "internal" && `tag-${tagged}`,
        (!nodeInPhase(m.id) || filteredOut(m.id, ctx)) && "dim", !close && focus && !focus.has(m.id) && "unfocused",
        state.selected === m.id && "selected"),
      "data-node-id": m.id,
    },
      h("header", { class: "card-head", onclick: () => select(m.id) },
        h("div", { class: "title" },
          h("span", { class: "name" }, m.name),
          m.depth === "stub" ? h("span", { class: "badge" }, "not mapped") : null,
          tally(all),
          close ? h("button", { class: "x", "aria-label": `Close ${m.name}`, onclick: (ev) => { ev.stopPropagation(); close(); } }, "×") : null),
        h("p", { class: "purpose" }, terms(m.purpose)),
        facts(m.id).length ? h("div", { class: "facts" }, facts(m.id)) : null,
        noteLine(m.note),
        srcLine(m.sources),
        reactsTo(m),
        changeList(cs)),
      group("endpoints", "Endpoints", m.endpoints.length, endpointList(m, ctx)),
      group("contracts", "Contracts", m.contracts.length, m.contracts.map((c) => contractRow(m, c, ctx))),
      group("data", "Data", m.entities.length, m.aggregates.map((a) => aggregateBox(m, a, ctx)), loose.map((e) => entityRow(e, ctx))),
      group("storage", "Storage", m.stores.reduce((n, st) => n + st.tables.length, 0), m.stores.map((st) => storeBox(st, ctx))),
      group("inside", "Inside", m.modules.length, m.modules.map((sub) => subModule(sub, ctx))));
  }

  // A labelled band inside a card, coloured by the kind of thing it holds.
  function group(kind, label, count, ...rows) {
    if (!count) return null;
    return h("section", { class: `group k-${kind}` },
      h("div", { class: "group-label" }, h("span", {}, label), h("span", { class: "group-count" }, String(count))),
      rows);
  }

  // An aggregate is drawn as a boundary around the tables it holds, with the
  // root first. Its invariants open with it.
  function aggregateBox(m, a, ctx) {
    const open = state.open.has(a.id);
    const byId = new Map(m.entities.map((e) => [e.id, e]));
    return h("section", { class: cls("aggregate", open && "open", state.selected === a.id && "selected", (!nodeInPhase(a.id) || filteredOut(a.id, ctx)) && "dim"), "data-node-id": a.id },
      h("button", { class: "agg-head", "aria-expanded": String(open), onclick: () => toggle(a.id) },
        h("span", { class: "agg-label" }, `${a.name} aggregate`),
        a.invariants.length ? h("span", { class: "meta" }, `${a.invariants.length} rule${a.invariants.length === 1 ? "" : "s"}`) : null,
        h("span", { class: "chev", "aria-hidden": "true" }, "›")),
      changeList(ctx.placed.get(a.id)),
      open && a.invariants.length ? h("ol", { class: "invariants" }, a.invariants.map((i) => h("li", {}, terms(i)))) : null,
      [a.root, ...a.members].map((id) => byId.get(id)).filter(Boolean).map((e) => entityRow(e, ctx, e.id === a.root)));
  }

  // A sub-module is a row until opened, then a card nested inside its parent.
  function subModule(sub, ctx) {
    const open = state.open.has(sub.id);
    if (open) return h("div", { class: "nested" }, moduleCard(sub, ctx, () => toggle(sub.id)));
    return h("section", { class: cls("row", "sub", state.selected === sub.id && "selected", (!nodeInPhase(sub.id) || filteredOut(sub.id, ctx)) && "dim"), "data-node-id": sub.id },
      rowHead(sub.id, boxIcon(), sub.name, sub.depth === "stub" ? "not mapped" : terms(sub.purpose), ctx, "sub-purpose"));
  }

  // Events are the one relationship a wire can't label legibly, so the
  // subscriber says what it listens for.
  function reactsTo(m) {
    const evs = tree().edges.filter((e) => e.kind === "event" && e.to === m.id);
    if (!evs.length) return null;
    return h("div", { class: "listens" }, h("span", { class: "listens-label" }, "reacts to"),
      evs.map((e) => [h("button", { class: "linklike quiet", onclick: (ev) => { ev.stopPropagation(); reveal(e.from); } }, e.from.split("/").pop()),
        e.label.split(", ").map((x) => h("span", { class: "ev" }, x))]));
  }

  function allChangesIn(id, ctx) {
    const out = [];
    for (const [p, cs] of ctx.placed) if (under(p, id)) out.push(...cs);
    return out;
  }

  function rowHead(id, icon, label, meta, ctx, metaClass) {
    const t = state.tab === "change" ? worst(allChangesIn(id, ctx)) : null;
    return h("button", {
      class: cls("row-head", t && t !== "internal" && `mark-${t}`), "aria-expanded": String(state.open.has(id)),
      onclick: () => toggle(id),
    }, icon, h("span", { class: "row-name" }, label), meta ? h("span", { class: cls("meta", metaClass) }, meta) : null,
    (doc.facts[id] || []).length ? h("span", { class: "has-facts", title: doc.facts[id].map((f) => `${f.label}: ${f.value}`).join("\n") }, "#") : null,
    h("span", { class: "chev", "aria-hidden": "true" }, "›"));
  }
  const rowClass = (id, ctx, open, ...more) =>
    cls("row", open && "open", (!nodeInPhase(id) || filteredOut(id, ctx)) && "dim", state.selected === id && "selected", ...more);

  function contractRow(m, c, ctx) {
    const open = state.open.has(c.id) && m.depth === "mapped";
    const n = c.operations.length + c.events.length;

        const { a, b, d } = best, k = Math.max(30, Math.min(140, d * 0.4));
        over.append(s("path", {
          d: `M${a.x},${a.y} C${a.x + a.nx * k},${a.y} ${b.x + b.nx * k},${b.y} ${b.x},${b.y}`,
          class: cls("wire", "type", hot && "hot"),
        }));
      }
    }
  }

  // ---- below the canvas: context ---------------------------------------------------
  // Open questions come first and start open: they are what the reader owes.
  function context() {
    const parts = [];
    const section = (key, title, count, extra, ...body) => h("details", {
      class: cls("ctx", extra), open: state.ctxOpen.has(key), id: `ctx-${key}`,
      ontoggle: (ev) => { ev.target.open ? state.ctxOpen.add(key) : state.ctxOpen.delete(key); },
    }, h("summary", {}, h("h2", {}, title, h("span", { class: "count" }, String(count)))), body);
    const nodeLink = (id) => h("button", { class: "node-link", onclick: () => reveal(id) }, pretty(id));
    if (doc.questions.length) {
      parts.push(section("questions", "Needs your call", doc.questions.length, "asks", h("ol", { class: "qs" }, doc.questions.map((q) => h("li", {},
        h("div", { class: "q" }, terms(q.text)),
        q.options ? h("div", { class: "options" }, q.options.map((o) => h("span", { class: "option" }, o))) : null,
        q.node ? nodeLink(q.node) : null)))));
    }
    if (view.changes.length && doc.slices.length) {
      const ids = allIds(view.proposed);
      const taken = new Set();
      const phaseCards = h("div", { class: "phases" }, doc.slices.map((sl, i) => {
        const cs = view.changes.filter((c) => !taken.has(c) && changeInPhase(c, sl.nodes));
        cs.forEach((c) => taken.add(c));
        return h("div", { class: cls("phase", state.phase === i && "active") },
          h("h3", {}, h("span", { class: "step" }, String(i + 1)), sl.name, tally(cs)),
          h("p", {}, terms(sl.goal)),
          sl.notes ? h("p", { class: "muted" }, terms(sl.notes)) : null,
          h("button", { class: "linklike", onclick: () => showPhase(i) }, state.phase === i ? "Showing on the map" : "Show on the map"));
      }));
      const rest = view.changes.filter((c) => !taken.has(c) && c.tag !== "internal");
      parts.push(section("phases", "Phases", doc.slices.length, null, phaseCards,
        rest.length ? h("p", { class: "muted" }, `${rest.length} change(s) not in a phase yet: `,
          rest.map((c, i) => [i ? ", " : "", h("button", { class: "linklike", onclick: () => reveal(placeOf(c, ids)) }, c.what)])) : null));
    }
    if (doc.decisions.length) {
      parts.push(section("decisions", "Decisions", doc.decisions.length, null, h("ul", { class: "ds" }, doc.decisions.map((d) => h("li", {},
        h("div", { class: "d" }, terms(d.text)), h("div", { class: "why" }, h("span", { class: "why-label" }, "why "), terms(d.why)),
        d.node ? nodeLink(d.node) : null)))));
    }
    const diags = tree().diagnostics;
    if (diags.length) {
      parts.push(section("checks", "Check results", diags.length, null, diags.map((d) =>
        h("div", { class: `diag ${d.level}` }, h("strong", {}, d.level), " ", h("code", {}, d.at), h("div", {}, d.message)))));
    }
    if (GLOSSARY.length) {
      parts.push(section("glossary", "Domain words", GLOSSARY.length, null, h("dl", { class: "glossary" }, GLOSSARY.map((g) => [
        h("dt", {}, g.node ? h("button", { class: "linklike", onclick: () => reveal(g.node) }, g.term) : g.term),
        h("dd", {}, g.meaning)]))));
    }
    return parts.length ? h("section", { class: "context" }, parts) : null;
  }

  function openSection(key) {
    state.ctxOpen.add(key);
    render();
    document.getElementById(`ctx-${key}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ---- briefing: the page in ten seconds ----------------------------------------------
  // What was asked, what it costs, what needs an answer, and the order to
  // read it in. Each tile is also a filter or a shortcut.
  function briefing() {
    const t = tree();
    const tile = (cls_, n, label, onclick, active, title) => h("button", {
      class: cls("tile", cls_, active && "active", !n && "zero"), onclick, title, "aria-pressed": active ? "true" : "false", disabled: !n,
    }, h("span", { class: "n" }, String(n)), h("span", { class: "l" }, label));
    const count = (tag) => view.changes.filter((c) => c.tag === tag && (state.phase == null || changeInPhase(c, doc.slices[state.phase].nodes))).length;
    const only = (tag) => () => { state.tab = "change"; state.only = state.only === tag ? null : tag; render(); };
    const ms = everyModule(t.modules);
    const warnings = t.diagnostics.length;
    const tiles = view.proposed
      ? [
        tile("breaking", count("breaking"), "breaking", only("breaking"), state.only === "breaking", "Consumers must change. Click to show only these."),
        tile("migration", count("migration"), "migrations", only("migration"), state.only === "migration", "Stored data must change. Click to show only these."),
        tile("additive", count("additive"), "additive", only("additive"), state.only === "additive", "Nothing existing changes. Click to show only these."),
      ]
      : [
        tile("plain", ms.filter((m) => m.depth === "mapped").length, "modules mapped"),
        tile("plain", ms.reduce((n, m) => n + m.contracts.length, 0), "contracts"),
        tile("plain", ms.reduce((n, m) => n + m.entities.length, 0), "tables"),
        tile("plain", ms.reduce((n, m) => n + m.endpoints.length, 0), "endpoints"),
      ];
    tiles.push(tile("asks", doc.questions.length, doc.questions.length === 1 ? "question for you" : "questions for you", () => openSection("questions")));
    if (warnings) tiles.push(tile("checks", warnings, warnings === 1 ? "check finding" : "check findings", () => openSection("checks")));
    const steps = doc.slices.length && view.proposed
      ? h("ol", { class: "stepper", "aria-label": "Phases" },
        h("li", {}, h("button", { "aria-pressed": String(state.phase == null), onclick: () => { state.phase = null; render(); } }, "All")),
        doc.slices.map((sl, i) => h("li", {}, h("button", {
          "aria-pressed": String(state.phase === i), title: sl.goal,
          onclick: () => { state.tab = "change"; state.phase = state.phase === i ? null : i; render(); },
        }, h("span", { class: "step" }, String(i + 1)), sl.name))))
      : null;
    return h("section", { class: "briefing" },
      h("div", { class: "ask" }, h("div", { class: "eyebrow" }, doc.mode === "learn" ? "What we're learning" : "The change"), h("p", {}, terms(doc.intent))),
      h("div", { class: "tiles" }, tiles),
      steps,
      GLOSSARY.length ? h("div", { class: "words" }, h("span", { class: "eyebrow" }, "Domain words"),
        GLOSSARY.map((g) => h("button", { class: "term word", "data-tip": g.meaning, "data-term": g.term, onclick: () => g.node && reveal(g.node) }, g.term))) : null);
  }

  // ---- search: jump to anything ------------------------------------------------------
  function searchIndex() {
    const out = [];
    for (const m of everyModule(tree().modules)) {
      out.push({ id: m.id, label: m.name, kind: "module", hint: m.purpose });
      for (const ep of m.endpoints) out.push({ id: ep.id, label: `${ep.method || ep.protocol} ${ep.path}`, kind: "endpoint", hint: ep.calls.map((c) => c.label).join(", ") });
      for (const c of m.contracts) {
        out.push({ id: c.id, label: c.name, kind: "contract", hint: m.name });
        for (const o of c.operations) out.push({ id: o.id, label: `${c.name}.${o.name}`, kind: "operation", hint: o.mode });
        for (const e of c.events) out.push({ id: e.id, label: `${c.name}.${e.name}`, kind: "event", hint: "event" });
        for (const ty of c.types) out.push({ id: ty.id, label: ty.name, kind: "type", hint: c.name });
      }
      for (const e of m.entities) out.push({ id: e.id, label: e.name, kind: "data", hint: m.name });
      for (const st of m.stores) for (const tb of st.tables) out.push({ id: tb.id, label: tb.table, kind: "storage", hint: `${ENGINES[st.engine] || st.engine} · ${st.name}` });
    }
    for (const g of GLOSSARY) out.push({ id: g.node, label: g.term, kind: "word", hint: g.meaning });
    return out;
  }
  function search() {
    let hits = [], at = 0;
    const list = h("ul", { class: "hits", role: "listbox", hidden: true });
    const go = (hit) => { input.value = ""; list.hidden = true; input.blur(); if (hit?.id) reveal(hit.id); };
    const draw = () => {
      list.replaceChildren(...hits.map((x, i) => h("li", { role: "option", class: cls(i === at && "on"), "aria-selected": String(i === at),
        onmousedown: (ev) => { ev.preventDefault(); go(x); } },
      h("span", { class: `kind k-${x.kind}` }, x.kind), h("span", { class: "hit-label" }, x.label), h("span", { class: "hit-hint" }, x.hint))));
      list.hidden = !hits.length;
    };
    const input = h("input", {
      type: "search", id: "search", placeholder: "Jump to…  /", "aria-label": "Jump to a module, endpoint, table or word", autocomplete: "off",
      oninput: () => {
        const q = input.value.trim().toLowerCase();
        const idx = searchIndex();
        hits = q ? idx.filter((x) => x.label.toLowerCase().includes(q) || (x.kind === "word" && x.hint.toLowerCase().includes(q)))
          .sort((a, b) => Number(!a.label.toLowerCase().startsWith(q)) - Number(!b.label.toLowerCase().startsWith(q))).slice(0, 8) : [];
        at = 0; draw();
      },
      onkeydown: (ev) => {
        if (ev.key === "ArrowDown") { at = Math.min(hits.length - 1, at + 1); draw(); ev.preventDefault(); }
        else if (ev.key === "ArrowUp") { at = Math.max(0, at - 1); draw(); ev.preventDefault(); }
        else if (ev.key === "Enter") go(hits[at]);
        else if (ev.key === "Escape") { input.value = ""; hits = []; draw(); input.blur(); }
      },
      onblur: () => setTimeout(() => { list.hidden = true; }, 100),
    });
    return h("div", { class: "search" }, input, list);
  }

  // Keys for working quickly: / search, esc clear, f fit, 0-9 phases.
  document.addEventListener("keydown", (ev) => {
    if (ev.target.closest?.("input, textarea") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === "/") { ev.preventDefault(); document.getElementById("search")?.focus(); }
    else if (ev.key === "Escape") {
      if (state.selected || state.only || state.phase != null) { state.selected = null; state.only = null; state.phase = null; render(); }
    } else if (ev.key === "f") fit();
    else if (/^[0-9]$/.test(ev.key) && view.proposed) {
      const i = Number(ev.key) - 1;
      if (i < doc.slices.length) { state.tab = "change"; state.phase = i < 0 ? null : i; render(); }
    }
  });

  function showPhase(i) {
    state.tab = "change";
    state.phase = state.phase === i ? null : i;
    render();
    document.getElementById("viewport")?.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // ---- sidebar: the conversation ----------------------------------------------------
  function sidebar() {
    const anchor = state.selected;
    const copy = () => {
      const text = [`Notes on the plan "${doc.title}":`, ...state.notes.map((n) => `- [${n.anchor || "general"}] ${n.text}`)].join("\n");
      navigator.clipboard?.writeText(text).then(() => flashButton("copy", "Copied"), () => flashButton("copy", "Copy failed"));
    };
    const queue = () => {
      const text = state.draft.trim();
      if (!text) return;
      state.notes.push({ anchor, text });
      state.draft = "";
      saveNotes();
      render();
    };
    return h("aside", { class: "chat", "aria-label": "Conversation" },
      h("div", { class: "chat-head" }, "Conversation"),
      h("div", { class: "msgs" },
        state.notes.length ? null : h("p", { class: "empty" }, "Notes you add land here. Click anything on the map first to pin a note to it, then copy them all as one prompt for the agent."),
        state.notes.map((n, i) => h("div", { class: "msg you queued" },
          h("div", { class: "who" }, n.anchor ? h("button", { class: "linklike", onclick: () => reveal(n.anchor) }, pretty(n.anchor)) : "General",
            h("button", { class: "x", "aria-label": "Remove note", onclick: () => { state.notes.splice(i, 1); saveNotes(); render(); } }, "×")),
          n.text))),
      h("div", { class: "composer" },
        h("div", { class: "about" }, anchor
          ? ["About ", h("b", {}, pretty(anchor)), h("button", { class: "x", "aria-label": "Clear", onclick: () => select(anchor) }, "×")]
          : h("span", { class: "muted" }, "Click anything on the map to attach a note to it.")),
        h("textarea", {
          rows: 3, placeholder: "Write a note…", "aria-label": "Note",
          oninput: (ev) => { state.draft = ev.target.value; },
          onkeydown: (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); queue(); } },
        }, state.draft),
        h("div", { class: "actions" },
          h("button", { class: "btn", onclick: queue }, "Add note"),
          h("button", { class: "btn quiet", id: "copy", disabled: !state.notes.length, onclick: copy },
            state.notes.length ? `Copy ${state.notes.length} as prompt` : "Copy as prompt"))));
  }
  function flashButton(id, text) {
    const b = document.getElementById(id);
    if (!b) return;
    const was = b.textContent;
    b.textContent = text;
    setTimeout(() => { b.textContent = was; }, 1200);
  }
  function loadNotes() {
    try { return JSON.parse(localStorage.getItem(NOTES_KEY) || "[]"); } catch { return []; }
  }
  function saveNotes() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(state.notes)); } catch { /* storage unavailable */ }
  }

  // ---- page ---------------------------------------------------------------------------
  function render() {
    const tabs = view.proposed
      ? h("div", { class: "tabs", role: "group", "aria-label": "Which tree" },
        [["current", "Before"], ["proposed", "After"], ["change", "Change"]].map(([k, label]) =>
          h("button", { "aria-pressed": String(state.tab === k), onclick: () => { state.tab = k; if (k !== "change") state.only = null; render(); } }, label)))
      : null;
    const filters = [
      state.only ? h("button", { class: `filter-chip ${state.only}`, onclick: () => { state.only = null; render(); } }, `only ${state.only}`, h("span", { "aria-hidden": "true" }, " ×")) : null,
      state.selected ? h("button", { class: "filter-chip", onclick: () => { state.selected = null; render(); } }, `focus: ${pretty(state.selected)}`, h("span", { "aria-hidden": "true" }, " ×")) : null,
    ];
    const textarea = document.activeElement?.tagName === "TEXTAREA";
    document.getElementById("app").replaceChildren(h("div", { class: "shell" },
      h("main", { class: "main" },
        h("header", { class: "top" },
          h("div", { class: "heading" }, h("h1", {}, doc.title), h("span", { class: "badge" }, doc.mode === "learn" ? "learning" : "plan")),
          h("div", { class: "controls" }, search(), tabs)),
        briefing(),
        filters.some(Boolean) ? h("div", { class: "filters" }, filters) : null,
        canvas(),
        context()),
      sidebar()),
    h("div", { id: "tip", class: "tip", role: "tooltip", hidden: true }));
    if (textarea) document.querySelector(".composer textarea")?.focus();
    layoutGraph();
    if (!state.fitted) { fit(); state.fitted = true; }
    drawWires();
  }

  window.addEventListener("resize", () => requestAnimationFrame(drawWires));
  render();
})();

</script>
</body>
</html>
